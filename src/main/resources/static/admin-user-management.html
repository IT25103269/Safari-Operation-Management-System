<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Role Management - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1050px; background: white; padding: 25px; margin: auto; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-link { color: #2980b9; text-decoration: none; font-weight: bold; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; font-size: 0.9em; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9em; }
        .update-btn { background-color: #27ae60; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: background 0.2s; }
        .update-btn:hover { background-color: #219150; }
        .role-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.82em; font-weight: bold; background-color: #e2e8f0; color: #334155; }
        .alert { padding: 10px 14px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 0.9em; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>User Role & Account Access Management</h2>
        <a href="admin-dashboard.html" class="back-link">&larr; Back to Admin Console</a>
    </div>

    <div id="alertBox" class="alert"></div>

    <p style="font-size: 0.9em; color: #555;">Select a new role from the dropdown menu to update system permissions for employee or tourist accounts in the database.</p>

    <table>
        <thead>
        <tr>
            <th>User ID</th>
            <th>Full Name</th>
            <th>Email Address</th>
            <th>Current Role</th>
            <th>Assign New Role</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr>
                <td colspan="6" style="text-align: center; color: #777;">Loading users...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const availableRoles = [
        { value: "admin", label: "Operations Manager (Admin)" },
        { value: "manager", label: "Park & Cottage Manager" },
        { value: "guide", label: "Safari Guide" },
        { value: "driver", label: "Safari Driver" },
        { value: "officer", label: "Wildlife Info Officer" },
        { value: "Tourist", label: "Tourist" }
    ];

    function showAlert(msg, isSuccess) {
        const box = document.getElementById('alertBox');
        box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    async function loadUsers() {
        const tbody = document.getElementById('usersTableBody');
        try {
            const res = await fetch('/api/user/admin/all');
            if (!res.ok) throw new Error("Could not load users");
            const users = await res.json();

            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">No users registered yet.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => {
                const options = availableRoles.map(r => {
                    const isSelected = (u.role && u.role.toLowerCase() === r.value.toLowerCase()) ? "selected" : "";
                    return `<option value="${r.value}" ${isSelected}>${r.label}</option>`;
                }).join('');

                return `
                <tr>
                    <td><strong>USR-${u.userId}</strong></td>
                    <td>${u.fullName}</td>
                    <td>${u.email}</td>
                    <td><span class="role-badge">${u.role}</span></td>
                    <td>
                        <select id="roleSelect-${u.userId}">
                            ${options}
                        </select>
                    </td>
                    <td>
                        <button class="update-btn" onclick="updateRole(${u.userId})">Update Role</button>
                    </td>
                </tr>
                `;
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #c0392b;">Error loading users from server.</td></tr>';
        }
    }

    async function updateRole(userId) {
        const select = document.getElementById('roleSelect-' + userId);
        const newRole = select.value;

        try {
            const res = await fetch('/api/user/admin/' + userId + '/role', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole })
            });
            const data = await res.json();
            if (res.ok) {
                showAlert("Role updated successfully for USR-" + userId + " to " + newRole, true);
                loadUsers();
            } else {
                showAlert(data.message || "Failed to update role", false);
            }
        } catch (err) {
            showAlert("Server communication error", false);
        }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
</script>

</body>
</html>
