<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Lanka Wild Trails</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .profile-card { max-width: 500px; background: white; padding: 25px; margin: auto; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        input[disabled] { background-color: #e9ecef; cursor: not-allowed; }
        .role-badge { display: inline-block; background-color: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        button { width: 100%; background-color: #2c3e50; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1a252f; }
        .alert { padding: 10px; border-radius: 4px; font-size: 0.85em; margin-bottom: 15px; display: none; text-align: center; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .section-title { margin-top: 25px; border-bottom: 1px solid #eee; padding-bottom: 5px; color: #34495e; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>My Account Profile</h2>
    <div id="alert-msg" class="alert"></div>

    <form id="profileForm">
        <div class="form-group">
            <label>Role / Account Type</label>
            <span id="roleBadge" class="role-badge">-</span>
        </div>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>

        <button type="submit">Update Profile</button>
    </form>

    <div class="section-title">Change Password</div>
    <form id="passwordForm">
        <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required>
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required>
        </div>

        <button type="submit" style="background-color: #e67e22;">Change Password</button>
    </form>
</div>

<script>
    const alertDiv = document.getElementById('alert-msg');

    function showAlert(msg, isSuccess) {
        alertDiv.innerText = msg;
        alertDiv.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        alertDiv.style.display = 'block';
    }

    // 1. Fetch profile details on page load
    async function loadProfile() {
        try {
            const res = await fetch('/api/user/profile');
            if (res.status === 401) {
                window.location.href = '/login.html';
                return;
            }
            const data = await res.json();
            document.getElementById('fullName').value = data.fullName;
            document.getElementById('email').value = data.email;
            document.getElementById('roleBadge').innerText = data.role;
        } catch (err) {
            showAlert('Failed to load profile details.', false);
        }
    }

    // 2. Update Info Form
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value
        };

        const res = await fetch('/api/user/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        showAlert(result.message, res.ok);
    });

    // 3. Update Password Form
    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: document.getElementById('newPassword').value
        };

        const res = await fetch('/api/user/change-password', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        showAlert(result.message, res.ok);
        if (res.ok) {
            document.getElementById('passwordForm').reset();
        }
    });

    loadProfile();
</script>
</body>
</html>
