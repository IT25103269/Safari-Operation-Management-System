r 1fr 1fr;gap:40px;max-width:1320px;margin:0 auto;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1);}\n  footer .brand{color:#fff;margin-bottom:14px;}\n  footer .brand span{color:var(--accent);}\n  footer p{font-size:13.5px;color:#96a89d;max-width:280px;}\n  footer h4{font-size:12px;letter-spacing:1px;color:#fff;margin:0 0 16px;text-transform:uppercase;}\n  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}\n  footer a{font-size:13.5px;color:#a9bcb0;}\n  footer a:hover{color:var(--accent);}\n  .foot-bottom{max-width:1320px;margin:24px auto 0;display:flex;justify-content:space-between;font-size:12px;color:#7c8f83;}\n\n  #toast{position:fixed;bottom:28px;right:28px;background:var(--primary);color:#fff;padding:15px 26px;border-radius:10px;display:none;z-index:200;font-size:13.5px;box-shadow:0 15px 35px rgba(0,0,0,.3);border:1px solid var(--accent);}\n\n  @media(max-width:1000px){\n    .top-bar{padding:16px 24px;} .top-links{display:none;}\n    main{padding:32px 24px 0;}\n    .gallery-row{grid-template-columns:1fr;} .hero-frame{min-height:340px;} .side-picks{flex-direction:row;} .pick-card{min-height:160px;}\n    .content-grid{grid-template-columns:1fr;gap:36px;} .reserve-card{position:static;}\n    .spaces-grid{grid-template-columns:1fr;} .high-grid{grid-template-columns:1fr 1fr;}\n    section.others{padding:60px 24px;} .others-head{flex-direction:column;align-items:flex-start;gap:6px;}\n  }\n</style>\n</head>\n<body>\n\n<nav class=\"top-bar\">\n  <a href=\"home.html\" class=\"brand\">\ud83c\udf3f Lanka Wild Trails <span>Sanctuary</span></a>\n  <div class=\"top-links\">\n    <a href=\"home.html\">Journal</a>\n    <a href=\"welcome.html\">The Sanctuary</a>\n    <a href=\"room.html\" class=\"current\">Cottages</a>\n    <a href=\"index.html\" class=\"staff-link\">Staff Portal</a>\n  </div>\n  <button class=\"book-btn\" onclick=\"document.getElementById('reserveForm').scrollIntoView({behavior:'smooth'})\">Reserve Now</button>\n</nav>\n\n<main>\n  <div class=\"gallery-row\">\n    <div class=\"hero-frame\" id=\"heroFrame\">\n      <div class=\"shade\"></div>\n      <button class=\"arrow-btn prev\" onclick=\"cyclePick(-1)\">\u2039</button>\n      <button class=\"arrow-btn next\" onclick=\"cyclePick(1)\">\u203a</button>\n      <div class=\"content\">\n        <span class=\"status hero-anim d1\" id=\"heroStatus\">AVAILABLE</span>\n        <h1 id=\"heroName\" class=\"hero-anim d2\">Loading cottage\u2026</h1>\n        <div class=\"loc hero-anim d3\" id=\"heroLoc\">Fetching details from the reservation system</div>\n      </div>\n    </div>\n    <div class=\"side-picks\" id=\"sidePicks\">\n      <div class=\"pick-card\"><div class=\"shade\"></div><div class=\"info\"><h4>&nbsp;</h4><span class=\"rate\">&nbsp;</span></div></div>\n      <div class=\"pick-card\"><div class=\"shade\"></div><div class=\"info\"><h4>&nbsp;</h4><span class=\"rate\">&nbsp;</span></div></div>\n    </div>\n  </div>\n\n  <div class=\"content-grid\">\n    <div>\n      <div class=\"tabs\">\n        <a class=\"on\">General</a>\n        <a>Reviews</a>\n        <a>Policies</a>\n        <a>Gallery</a>\n      </div>\n\n      <div class=\"about reveal\">\n        <span class=\"status\" id=\"aboutType\" style=\"display:inline-block;background:#f0ece0;color:var(--secondary);border:1px solid var(--line);margin-bottom:14px;\">DELUXE</span>\n        <h2 id=\"aboutName\">About this cottage</h2>\n        <p id=\"aboutDesc\">Loading description\u2026</p>\n\n        <div class=\"rating\">\n          <span class=\"score\">4.9</span>\n          <span class=\"stars\">\u2605\u2605\u2605\u2605\u2605</span>\n          <span class=\"count\">38 verified guest reviews</span>\n        </div>\n\n        <div class=\"amen-grid\" id=\"amenGrid\">\n          <div>King bed & mosquito canopy</div>\n          <div>Private plunge deck</div>\n          <div>Solar hot water</div>\n          <div>In-room naturalist journal</div>\n          <div>Full board included</div>\n          <div>Two guided walks daily</div>\n        </div>\n\n        <ul class=\"policy-list\">\n          <li><strong>Check-in</strong> from 2:00 PM &nbsp;\u00b7&nbsp; <strong>Check-out</strong> by 11:00 AM</li>\n          <li><strong>Cancellation</strong> free up to 7 days before arrival, 50% refund within 7 days</li>\n          <li><strong>Children</strong> welcome from age 8, due to proximity to the buffer zone</li>\n          <li><strong>Conservation fee</strong> LKR 2,500/night included in the rate shown</li>\n        </ul>\n      </div>\n\n      <div class=\"special reveal\">\n        <h3>Included with every stay</h3>\n        <ul>\n          <li>Two guided walks daily with a resident tracker, timed around wildlife movement</li>\n          <li>Evening naturalist briefing on what's been sighted across the sanctuary</li>\n          <li>Full board \u2014 breakfast, lunch and dinner sourced from our kitchen garden</li>\n        </ul>\n      </div>\n    </div>\n\n    <div class=\"reserve-card reveal\" id=\"reserveForm\">\n      <h3>Reserve Your Stay</h3>\n      <div class=\"two-col\">\n        <div class=\"field\"><label>Check-in</label><input type=\"date\" id=\"rCheckIn\"></div>\n        <div class=\"field\"><label>Check-out</label><input type=\"date\" id=\"rCheckOut\"></div>\n      </div>\n      <div class=\"two-col\">\n        <div class=\"field\"><label>Guests</label><input type=\"number\" id=\"rGuests\" value=\"2\" min=\"1\"></div>\n        <div class=\"field\"><label>Extra beds</label><input type=\"number\" id=\"rExtraBeds\" value=\"0\" min=\"0\"></div>\n      </div>\n      <div class=\"field\"><label>Cottage</label><select id=\"rCottageSelect\"></select></div>\n      <div class=\"field\"><label>Full name</label><input type=\"text\" id=\"rName\" placeholder=\"Guest full name\"></div>\n      <div class=\"two-col\">\n        <div class=\"field\"><label>Email</label><input type=\"email\" id=\"rEmail\" placeholder=\"you@example.com\"></div>\n        <div class=\"field\"><label>Phone</label><input type=\"text\" id=\"rPhone\" placeholder=\"+94 77 ...\"></div>\n      </div>\n      <div class=\"field\"><label>Special requests</label><input type=\"text\" id=\"rRequests\" placeholder=\"Late arrival, dietary needs...\"></div>\n\n      <div class=\"price-line\">\n        <span>Nightly rate</span>\n        <span class=\"amt\" id=\"rRate\">LKR \u2014</span>\n      </div>\n      <div class=\"per\" id=\"rNightsNote\">Select your dates to see nights & total</div>\n\n      <button class=\"reserve-btn\" onclick=\"submitReservation()\">Request Reservation</button>\n      <div class=\"reserve-note\">No payment taken now \u2014 our team confirms by email within 24 hours.</div>\n    </div>\n  </div>\n\n  <section class=\"spaces\">\n    <h2>Versatile spaces across the sanctuary</h2>\n    <div class=\"spaces-grid\">\n      <div class=\"space-card reveal\" style=\"background-image:url('https://images.unsplash.com/photo-1760570317591-1a52e6ea1e8e?auto=format&fit=crop&w=900&q=80')\"><div class=\"shade\"></div><div class=\"lbl\">The Open Dining Deck</div></div>\n      <div class=\"space-card reveal stagger-2\" style=\"background-image:url('https://images.unsplash.com/photo-1733235015164-7210178aed4b?auto=format&fit=crop&w=700&q=80')\"><div class=\"shade\"></div><div class=\"lbl\">Cliff-Edge Bar</div></div>\n      <div class=\"space-card reveal stagger-4\" style=\"background-image:url('https://images.unsplash.com/photo-1702014861736-d62834317c5e?auto=format&fit=crop&w=700&q=80')\"><div class=\"shade\"></div><div class=\"lbl\">Reading Pavilion</div></div>\n    </div>\n  </section>\n\n  <section class=\"highlights\">\n    <h2>Highlights from across the sanctuary</h2>\n    <div class=\"high-grid\">\n      <div class=\"high-card reveal stagger-0\" style=\"background-image:url('https://images.unsplash.com/photo-1677741447050-e166cf1a1f14?auto=format&fit=crop&w=500&q=80')\"></div>\n      <div class=\"high-card reveal stagger-1\" style=\"background-image:url('https://images.unsplash.com/photo-1566708627877-859df13ae63e?auto=format&fit=crop&w=500&q=80')\"></div>\n      <div class=\"high-card reveal stagger-2\" style=\"background-image:url('https://images.unsplash.com/photo-1733235015164-7210178aed4b?auto=format&fit=crop&w=500&q=80')\"></div>\n      <div class=\"high-card reveal stagger-3\" style=\"background-image:url('https://images.unsplash.com/photo-1760570317591-1a52e6ea1e8e?auto=format&fit=crop&w=500&q=80')\"></div>\n    </div>\n  </section>\n</main>\n\n<section class=\"others\">\n  <div class=\"others-head\">\n    <div>\n      <h2>Explore the other thirteen cottages</h2>\n      <p>Live availability, pulled from the same reservation system your booking goes through.</p>\n    </div>\n  </div>\n  <div class=\"others-grid\" id=\"othersGrid\">\n    <p style=\"color:var(--muted)\">Loading cottages\u2026</p>\n  </div>\n</section>\n\n<footer>\n  <div class=\"foot-grid\">\n    <div>\n      <div class=\"brand\">\ud83c\udf3f Lanka Wild Trails <span>Sanctuary</span></div>\n      <p>A sixty-acre private sanctuary on the northern buffer of Yala National Park, Sri Lanka. Fourteen cottages, working conservation land.</p>\n    </div>\n    <div>\n      <h4>Explore</h4>\n      <ul><li><a href=\"home.html\">Journal</a></li><li><a href=\"welcome.html\">The Sanctuary</a></li><li><a href=\"room.html\">Cottages & Rates</a></li></ul>\n    </div>\n    <div>\n      <h4>Stay</h4>\n      <ul><li><a href=\"room.html\">Check Availability</a></li><li><a href=\"index.html\">Manage a Reservation</a></li><li><a href=\"welcome.html\">Conservation Fee</a></li></ul>\n    </div>\n    <div>\n      <h4>Contact</h4>\n      <ul><li><a href=\"tel:+94770000000\">+94 77 000 0000</a></li><li><a href=\"mailto:stay@lankawildtrails.lk\">stay@lankawildtrails.lk</a></li><li><a href=\"#\">Block 1, Yala Buffer Zone, LK</a></li></ul>\n    </div>\n  </div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Lanka Wild Trails Sanctuary</span>\n    <span>Built for the Software Engineering module \u2014 Cottage Reservation System</span>\n  </div>\n</footer>\n\n<div id=\"toast\"></div>\n\n<script>\n// ===== Matches the real backend contract (Spring Boot ApiResponse<T> wrapper) =====\nconst API_BASE = '/api/cottages';\nconst FALLBACK_IMG = 'https://images.unsplash.com/photo-1702014861736-d62834317c5e?auto=format&fit=crop&w=1000&q=80';\n\n// Pool of on-theme photos assigned to cottages that come back from the API\n// without an imageUrl of their own (the schema doesn't store one).\nconst PHOTO_POOL = [\n  'https://images.unsplash.com/photo-1566708627877-859df13ae63e?auto=format&fit=crop&w=1200&q=80',\n  'https://images.unsplash.com/photo-1677741447050-e166cf1a1f14?auto=format&fit=crop&w=1200&q=80',\n  'https://images.unsplash.com/photo-1733235015164-7210178aed4b?auto=format&fit=crop&w=1200&q=80',\n  'https://images.unsplash.com/photo-1702014861736-d62834317c5e?auto=format&fit=crop&w=1200&q=80'\n];\n\n// Sample data used only if the live API is unreachable, so the page still\n// demonstrates the full design/flow standalone. Shape matches the real DTO.\nconst SAMPLE_COTTAGES = [\n  { id: 1, cottageNumber: 'COT-101', cottageName: 'Leopard Rock Villa', cottageType: 'LUXURY_SUITE', basePricePerNight: 180.00, maxOccupancy: 2, status: 'AVAILABLE',\n    amenities: 'WiFi, AC, Private Deck, Plunge Pool',\n    description: 'Perched above the granite outcrop our trackers call Leopard Rock, with a glass wall facing the ridge where most of this season\\'s sightings were logged.' },\n  { id: 2, cottageNumber: 'COT-102', cottageName: 'Elephant Corridor Cottage', cottageType: 'DELUXE', basePricePerNight: 150.00, maxOccupancy: 3, status: 'AVAILABLE',\n    amenities: 'WiFi, AC, Garden View, Mini Bar',\n    description: 'Set forty metres back from the restored elephant corridor \u2014 early risers are rewarded most mornings from the private deck.' },\n  { id: 3, cottageNumber: 'COT-103', cottageName: 'Canopy Deluxe Cottage', cottageType: 'DELUXE', basePricePerNight: 130.00, maxOccupancy: 2, status: 'AVAILABLE',\n    amenities: 'WiFi, Fan Cooling, Private Deck',\n    description: 'Raised on stilts beneath the forest canopy, with a plunge deck angled toward the hornbill nesting trees.' },\n  { id: 4, cottageNumber: 'COT-104', cottageName: 'Riverside Family Chalet', cottageType: 'FAMILY_CHALET', basePricePerNight: 210.00, maxOccupancy: 5, status: 'AVAILABLE',\n    amenities: 'WiFi, AC, Two Bedrooms, Kitchenette',\n    description: 'Two bedrooms facing the seasonal river bend, built to sleep a family of five with room to spare.' }\n];\n\nlet cottages = [];\nlet current = null;\nlet currentIndex = 0;\n\n// Helper fetch function handling the Spring Boot ApiResponse wrapper: { success, message, data }\nasync function apiRequest(url, options = {}) {\n  options.headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };\n  const res = await fetch(url, options);\n  const json = await res.json();\n  if (!res.ok || !json.success) throw new Error(json.message || 'API operation failed');\n  return json.data;\n}\n\nfunction money(n){ return 'LKR ' + Number(n || 0).toFixed(2); }\nfunction typeLabel(t){ return String(t || 'STANDARD').replace(/_/g, ' '); }\nfunction normList(data){ return Array.isArray(data) ? data : (data && Array.isArray(data.content) ? data.content : []); }\nfunction photoFor(c, idx){ return c.imageUrl || PHOTO_POOL[idx % PHOTO_POOL.length]; }\n\nasync function loadCottages() {\n  try {\n    const data = await apiRequest(API_BASE);\n    const list = normList(data);\n    cottages = list.length ? list : SAMPLE_COTTAGES;\n  } catch (e) {\n    cottages = SAMPLE_COTTAGES;\n  }\n  const params = new URLSearchParams(location.search);\n  const idParam = params.get('id');\n  currentIndex = idParam ? Math.max(0, cottages.findIndex(c => String(c.id) === idParam)) : 0;\n  if (currentIndex === -1) currentIndex = 0;\n  renderCurrent();\n  renderSidePicks();\n  renderSelect();\n  renderOthers();\n  window.initReveal && window.initReveal();\n}\n\nfunction renderCurrent() {\n  const c = cottages[currentIndex];\n  current = c;\n  const img = photoFor(c, currentIndex);\n  const desc = c.description || 'Experience ultimate luxury surrounded by pristine wildlife habitats.';\n  const status = c.status || 'AVAILABLE';\n  const amenList = (c.amenities || 'WiFi, AC, Private Deck').split(',').map(a => a.trim()).filter(Boolean);\n\n  document.getElementById('heroFrame').style.backgroundImage = `url('${img}')`;\n  document.getElementById('heroStatus').textContent = status;\n  document.getElementById('heroName').textContent = c.cottageName;\n  document.getElementById('heroLoc').textContent = '\ud83c\udff7\ufe0f ' + c.cottageNumber + ' \u00b7 ' + typeLabel(c.cottageType) + ' \u00b7 Sleeps ' + (c.maxOccupancy || 2);\n  document.getElementById('aboutType').textContent = typeLabel(c.cottageType);\n  document.getElementById('aboutName').textContent = 'About ' + c.cottageName;\n  document.getElementById('aboutDesc').textContent = desc;\n  document.getElementById('amenGrid').innerHTML = amenList.map(a => `<div>${a}</div>`).join('');\n  document.getElementById('rRate').textContent = money(c.basePricePerNight) + ' / night';\n  document.title = c.cottageName + ' | Lanka Wild Trails';\n  const sel = document.getElementById('rCottageSelect');\n  if (sel.options.length) sel.value = c.id;\n  updateNightsNote();\n}\n\nfunction renderSidePicks() {\n  const wrap = document.getElementById('sidePicks');\n  const picks = cottages.map((c, i) => ({ c, i })).filter(p => p.i !== currentIndex).slice(0, 2);\n  wrap.innerHTML = picks.map(p => {\n    const img = photoFor(p.c, p.i);\n    return `<div class=\"pick-card reveal\" style=\"background-image:url('${img}')\" onclick=\"jumpTo(${p.i})\">\n      <div class=\"shade\"></div>\n      <div class=\"info\"><h4>${p.c.cottageName}</h4><span class=\"rate\">${money(p.c.basePricePerNight)}/night</span></div>\n    </div>`;\n  }).join('');\n}\n\nfunction jumpTo(idx) {\n  currentIndex = idx;\n  renderCurrent();\n  renderSidePicks();\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nfunction cyclePick(dir) {\n  currentIndex = (currentIndex + dir + cottages.length) % cottages.length;\n  renderCurrent();\n  renderSidePicks();\n}\n\nfunction renderSelect() {\n  const sel = document.getElementById('rCottageSelect');\n  sel.innerHTML = cottages.map(c =>\n    `<option value=\"${c.id}\">${c.cottageName} (${c.cottageNumber}) \u2014 ${money(c.basePricePerNight)}/night</option>`\n  ).join('');\n  sel.value = current ? current.id : cottages[0]?.id;\n  sel.addEventListener('change', () => {\n    const idx = cottages.findIndex(c => String(c.id) === sel.value);\n    if (idx !== -1) { currentIndex = idx; renderCurrent(); renderSidePicks(); }\n  });\n}\n\nfunction renderOthers() {\n  const grid = document.getElementById('othersGrid');\n  grid.innerHTML = cottages.map((c, idx) => {\n    const img = photoFor(c, idx);\n    return `<div class=\"oc-card reveal\" onclick=\"jumpTo(${idx})\">\n      <div class=\"oc-img\" style=\"background-image:url('${img}')\"></div>\n      <div class=\"oc-body\">\n        <h4>${c.cottageName}</h4>\n        <div class=\"loc\">\ud83c\udff7\ufe0f ${typeLabel(c.cottageType)} \u00b7 Sleeps ${c.maxOccupancy || 2}</div>\n        <div class=\"rate\">${money(c.basePricePerNight)} / night</div>\n      </div>\n    </div>`;\n  }).join('');\n}\n\nfunction updateNightsNote() {\n  const inD = document.getElementById('rCheckIn').value;\n  const outD = document.getElementById('rCheckOut').value;\n  const note = document.getElementById('rNightsNote');\n  if (!inD || !outD || !current) { note.textContent = 'Select your dates to see nights & total'; return; }\n  const nights = Math.round((new Date(outD) - new Date(inD)) / 86400000);\n  if (nights <= 0) { note.textContent = 'Check-out must be after check-in'; return; }\n  const extraBeds = Number(document.getElementById('rExtraBeds').value) || 0;\n  const total = nights * current.basePricePerNight + nights * extraBeds * 25;\n  note.textContent = `${nights} night${nights > 1 ? 's' : ''}${extraBeds ? ' \u00b7 ' + extraBeds + ' extra bed' + (extraBeds > 1 ? 's' : '') : ''} \u00b7 Estimated total ${money(total)}`;\n}\n\ndocument.getElementById('rCheckIn').addEventListener('change', updateNightsNote);\ndocument.getElementById('rCheckOut').addEventListener('change', updateNightsNote);\ndocument.getElementById('rExtraBeds').addEventListener('input', updateNightsNote);\n\nasync function submitReservation() {\n  const payload = {\n    cottageId: parseInt(document.getElementById('rCottageSelect').value),\n    guestName: document.getElementById('rName').value,\n    guestEmail: document.getElementById('rEmail').value,\n    guestPhone: document.getElementById('rPhone').value,\n    checkInDate: document.getElementById('rCheckIn').value,\n    checkOutDate: document.getElementById('rCheckOut').value,\n    numberOfGuests: parseInt(document.getElementById('rGuests').value) || 1,\n    extraBeds: parseInt(document.getElementById('rExtraBeds').value) || 0,\n    specialRequests: document.getElementById('rRequests').value\n  };\n  if (!payload.guestName || !payload.guestEmail || !payload.checkInDate || !payload.checkOutDate) {\n    toast('Please fill in your name, email and both dates', true);\n    return;\n  }\n  try {\n    await apiRequest(`${API_BASE}/reservations`, { method: 'POST', body: JSON.stringify(payload) });\n    toast('Reservation request submitted \u2014 check your email for confirmation.');\n    document.getElementById('rName').value = '';\n    document.getElementById('rEmail').value = '';\n    document.getElementById('rPhone').value = '';\n    document.getElementById('rRequests').value = '';\n  } catch (err) {\n    toast(err.message || 'Could not reach the booking system right now. Please try again shortly.', true);\n    console.error(err);\n  }\n}\n\nfunction toast(msg, isError) {\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.style.borderColor = isError ? '#991b1b' : 'var(--accent)';\n  t.style.display = 'block';\n  setTimeout(() => { t.style.display = 'none'; }, 3200);\n}\n\nloadCottages();\n<\/script>\n\n\n<!-- ===== Shared cross-page + animation kit (auto-injected) ===== -->\n<style id=\"wt-anim-style\">\n  @keyframes wtFadeUp { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }\n  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);}\n  .reveal.in-view{opacity:1; transform:translateY(0);}\n  .reveal.stagger-1{transition-delay:.06s;} .reveal.stagger-2{transition-delay:.14s;}\n  .reveal.stagger-3{transition-delay:.22s;} .reveal.stagger-4{transition-delay:.30s;}\n  .reveal.stagger-5{transition-delay:.38s;} .reveal.stagger-6{transition-delay:.46s;}\n  .hero-anim{opacity:0; transform:translateY(18px); animation:wtFadeUp .85s cubic-bezier(.16,1,.3,1) forwards;}\n  .hero-anim.d1{animation-delay:.05s;} .hero-anim.d2{animation-delay:.20s;}\n  .hero-anim.d3{animation-delay:.35s;} .hero-anim.d4{animation-delay:.50s;}\n</style>\n<script>\n(function(){\n  function initReveal(){\n    var els = document.querySelectorAll('.reveal');\n    els.forEach(function(el){\n      var r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92 && r.bottom > 0) el.classList.add('in-view');\n    });\n    if (window.__wtIO) { try { window.__wtIO.disconnect(); } catch(e){} }\n    var io = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('.reveal:not(.in-view)').forEach(function(el){ io.observe(el); });\n    window.__wtIO = io;\n  }\n  function playHero(){\n    document.querySelectorAll('.hero-anim').forEach(function(el){\n      el.style.animation = 'none';\n      void el.offsetWidth;\n      el.style.animation = '';\n    });\n  }\n  function countUp(el){\n    if (el.dataset.counted) return;\n    var raw = (el.textContent || '').trim();\n    var target = parseFloat(raw.replace(/[^0-9.]/g, ''));\n    if (!isFinite(target)) return;\n    el.dataset.counted = '1';\n    var suffix = raw.replace(/[0-9.,]/g, '');\n    var t0 = null, dur = 1100;\n    function step(ts){\n      if (!t0) t0 = ts;\n      var p = Math.min(1, (ts - t0) / dur);\n      var eased = 1 - Math.pow(1 - p, 3);\n      var val = Math.round(target * eased);\n      el.textContent = val + suffix;\n      if (p < 1) requestAnimationFrame(step);\n      else el.textContent = raw;\n    }\n    requestAnimationFrame(step);\n  }\n  function initCounters(){\n    var nums = document.querySelectorAll('.figure, .stat-box .n');\n    if (!nums.length) return;\n    var io2 = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ countUp(e.target); io2.unobserve(e.target); } });\n    }, { threshold: 0.4 });\n    nums.forEach(function(el){ io2.observe(el); });\n  }\n\n  // Cross-page navigation: works standalone (real files) and embedded (single-file artifact)\n  var PAGE_MAP = { 'home.html':'home', 'welcome.html':'welcome', 'room.html':'room', 'staff.html':'staff', 'index.html':'staff' };\n  document.addEventListener('click', function(e){\n    var a = e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];\n    if (PAGE_MAP[href] && window.parent && window.parent !== window && typeof window.parent.gotoPage === 'function') {\n      e.preventDefault();\n      window.parent.gotoPage(PAGE_MAP[href]);\n    }\n  }, true);\n\n  function hideEmbeddedNav(){\n    if (window.self === window.top) return;\n    document.querySelectorAll('.site-nav, .top-bar, .site-utility-bar').forEach(function(n){ n.style.display = 'none'; });\n    document.documentElement.classList.add('wt-embedded');\n  }\n\n  document.addEventListener('DOMContentLoaded', function(){\n    hideEmbeddedNav();\n    initReveal();\n    initCounters();\n    playHero();\n  });\n  window.initReveal = initReveal;\n  window.playHero = playHero;\n})();\n<\/script>\n\n</body>\n</html>\n", "staff": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Staff Console | Lanka Wild Trails</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --primary:#0f2318; --secondary:#284b36; --accent:#d4af37;\n    --cream:#fbf9f5; --text:#1c2620; --muted:#5a6e62; --line:#e6e1d3;\n    --shadow:0 20px 40px -15px rgba(15,35,24,0.12);\n    --transition:all .3s cubic-bezier(.16,1,.3,1);\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text);line-height:1.6;}\n  a{text-decoration:none;color:inherit;}\n\n  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;background:var(--primary);color:#fff;}\n  .brand{font-family:'Playfair Display',serif;font-size:19px;letter-spacing:1px;display:flex;align-items:baseline;gap:7px;}\n  .brand span{color:var(--accent);}\n  .top-links{display:flex;align-items:center;gap:28px;}\n  .top-links a{font-size:12.5px;font-weight:600;color:#c6d2cb;}\n  .top-links a:hover{color:#fff;}\n  .top-links a.current{color:var(--accent);}\n  #clock{font-size:12px;color:#9db6a6;}\n\n  .console-head{padding:44px 40px 8px;max-width:1400px;margin:0 auto;}\n  .console-head .eyebrow{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;}\n  .console-head h1{font-family:'Playfair Display',serif;font-size:32px;color:var(--primary);margin:8px 0 4px;font-weight:700;}\n  .console-head p{color:var(--muted);font-size:14px;margin:0;}\n\n  .container { max-width: 1400px; margin: 24px auto 70px; padding: 0 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 26px 28px; box-shadow: var(--shadow); }\n  .full-width { grid-column: 1 / -1; }\n  h2 { margin-top: 0; font-family:'Playfair Display',serif; font-weight:600; font-size: 20px; color: var(--primary); border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom:20px; }\n\n  form { display: grid; gap: 14px; }\n  .form-group { display: flex; flex-direction: column; gap: 6px; }\n  label { font-weight: 700; font-size: 0.75rem; letter-spacing:.3px; text-transform:uppercase; color: var(--muted); }\n  input, select, textarea, button { padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 0.92rem; font-family:inherit; outline:none; }\n  input, select, textarea { background: var(--secondary); color:#fff; }\n  input::placeholder, textarea::placeholder { color:#c9d6cd; }\n  input[type=\"date\"]::-webkit-calendar-picker-indicator{ filter:invert(1); }\n  select option { background: var(--secondary); color:#fff; }\n  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow:0 0 0 3px rgba(212,175,55,.15); }\n  button { background: var(--primary); color: #fff; border: none; font-weight: 700; cursor: pointer; transition: var(--transition); letter-spacing:.3px; }\n  button:hover { background: var(--secondary); }\n  .btn-secondary { background: var(--muted); }\n  .btn-secondary:hover{ background:#465a51; }\n  .btn-danger { background: #a13c3c; }\n  .btn-danger:hover{ background:#8a2f2f; }\n  table button{ padding:7px 12px; font-size:.78rem; margin-right:6px; border-radius:5px; }\n\n  table { width: 100%; border-collapse: collapse; margin-top: 6px; }\n  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 0.86rem; }\n  th { background: #f3efe4; color: var(--primary); font-weight:700; text-transform:uppercase; font-size:.72rem; letter-spacing:.4px; }\n  tr{ transition:var(--transition); }\n  tbody tr:hover{ background:#faf8f2; }\n\n  .badge { padding: 4px 11px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing:.3px; display:inline-block; }\n  .badge-AVAILABLE { background: #dcefe1; color: #1f5c37; }\n  .badge-OCCUPIED { background: #f6dede; color: #8a2c2c; }\n  .badge-MAINTENANCE { background: #eee3cf; color: #7a5a1e; }\n\n  /* ===== Staff login gate ===== */\n  #staffGate{ position:fixed; inset:0; z-index:5000; background:var(--primary); display:flex; align-items:center; justify-content:center; }\n  #staffGate.hidden{ display:none; }\n  .gate-box{ width:340px; max-width:88vw; background:#fff; border-radius:10px; padding:34px 30px; box-shadow:var(--shadow); text-align:center; }\n  .gate-box .lock-icon{ font-size:30px; margin-bottom:10px; }\n  .gate-box h2{ font-family:'Playfair Display',serif; color:var(--primary); margin:0 0 6px; font-size:20px; }\n  .gate-box p{ color:var(--muted); font-size:13px; margin:0 0 20px; }\n  .gate-box input{ width:100%; text-align:center; letter-spacing:4px; font-size:16px; margin-bottom:12px; }\n  .gate-box button{ width:100%; background:var(--primary); color:#fff; border:none; padding:12px; border-radius:6px; font-weight:700; cursor:pointer; }\n  .gate-box button:hover{ background:var(--secondary); }\n  .gate-error{ color:#a13c3c; font-size:12.5px; margin-top:10px; min-height:16px; }\n  #staffContent.locked{ filter:blur(6px); pointer-events:none; user-select:none; }\n  .badge-PENDING { background: #faf0cf; color: #8a6a12; }\n  .badge-CONFIRMED { background: #dbe6f2; color: #24486b; }\n  .badge-CHECKED_IN { background: #e2dcf2; color: #4a2f8a; }\n  .badge-CHECKED_OUT { background: #e6e1d3; color: #5a6e62; }\n  .badge-REJECTED, .badge-CANCELLED { background: #f6dede; color: #8a2c2c; }\n  .badge-COMPLETED { background: #dcefe1; color: #1f5c37; }\n\n  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:6px; }\n  .stat-box{ background:var(--primary); color:#fff; border-radius:10px; padding:20px 22px; }\n  .stat-box .n{ font-family:'Playfair Display',serif; font-size:28px; color:var(--accent); }\n  .stat-box .l{ font-size:11.5px; color:#c6d2cb; margin-top:4px; }\n\n  #toast{ position:fixed; bottom:28px; right:28px; background:var(--primary); color:#fff; padding:15px 26px; border-radius:10px; display:none; z-index:200; font-size:13.5px; box-shadow:0 15px 35px rgba(0,0,0,.3); border:1px solid var(--accent); }\n\n  @media(max-width:1000px){\n    .top-bar{padding:16px 20px;} .top-links{display:none;}\n    .console-head{padding:30px 20px 8px;}\n    .container{grid-template-columns:1fr; padding:0 20px;}\n    .stat-strip{grid-template-columns:1fr 1fr;}\n  }\n</style>\n</head>\n<body>\n\n<div id=\"staffGate\">\n  <div class=\"gate-box\">\n    <div class=\"lock-icon\">\ud83d\udd12</div>\n    <h2>Staff Access</h2>\n    <p>Enter the staff password to open the console.</p>\n    <input type=\"password\" id=\"gatePassword\" placeholder=\"\u2022\u2022\u2022\u2022\" maxlength=\"12\" autocomplete=\"off\" />\n    <button id=\"gateSubmit\" type=\"button\">Unlock</button>\n    <div class=\"gate-error\" id=\"gateError\"></div>\n  </div>\n</div>\n\n<div id=\"staffContent\" class=\"locked\">\n\n<nav class=\"top-bar\">\n  <a href=\"home.html\" class=\"brand\" onclick=\"return goHome('home', event)\">\ud83c\udf3f Lanka Wild Trails <span>Sanctuary</span></a>\n  <div class=\"top-links\">\n    <a href=\"home.html\" onclick=\"return goHome('home', event)\">Journal</a>\n    <a href=\"welcome.html\" onclick=\"return goHome('welcome', event)\">The Sanctuary</a>\n    <a href=\"room.html\" onclick=\"return goHome('room', event)\">Cottages</a>\n    <a href=\"staff.html\" class=\"current\" onclick=\"return goHome('staff', event)\">Staff Console</a>\n  </div>\n  <div id=\"clock\"></div>\n</nav>\n\n<div class=\"console-head\">\n  <div class=\"eyebrow\">RESERVATIONS DESK</div>\n  <h1>Cottage Reservation System</h1>\n  <p>Live inventory and booking pipeline \u2014 every action here writes straight to the same database your guests book through.</p>\n</div>\n\n<div class=\"container\">\n\n  <div class=\"stat-strip full-width\">\n    <div class=\"stat-box reveal\"><div class=\"n\" id=\"statTotal\">\u2014</div><div class=\"l\">Cottages in the catalog</div></div>\n    <div class=\"stat-box reveal stagger-1\"><div class=\"n\" id=\"statAvailable\">\u2014</div><div class=\"l\">Currently available</div></div>\n    <div class=\"stat-box reveal stagger-2\"><div class=\"n\" id=\"statPending\">\u2014</div><div class=\"l\">Reservations pending approval</div></div>\n    <div class=\"stat-box reveal stagger-3\"><div class=\"n\" id=\"statCheckedIn\">\u2014</div><div class=\"l\">Guests currently checked in</div></div>\n  </div>\n\n  <!-- 1. COTTAGE CATALOG MANAGEMENT -->\n  <div class=\"card reveal\">\n    <h2>Add New Cottage</h2>\n    <form id=\"addCottageForm\">\n      <div class=\"form-group\">\n        <label>Cottage Number</label>\n        <input type=\"text\" id=\"cNumber\" placeholder=\"COT-101\" required />\n      </div>\n      <div class=\"form-group\">\n        <label>Cottage Name</label>\n        <input type=\"text\" id=\"cName\" placeholder=\"Leopard Haven\" required />\n      </div>\n      <div class=\"form-group\">\n        <label>Cottage Type</label>\n        <select id=\"cType\">\n          <option value=\"STANDARD\">STANDARD</option>\n          <option value=\"DELUXE\">DELUXE</option>\n          <option value=\"LUXURY_SUITE\">LUXURY SUITE</option>\n          <option value=\"FAMILY_CHALET\">FAMILY CHALET</option>\n        </select>\n      </div>\n      <div class=\"form-group\">\n        <label>Base Price / Night (LKR)</label>\n        <input type=\"number\" id=\"cPrice\" step=\"0.01\" placeholder=\"150.00\" required />\n      </div>\n      <div class=\"form-group\">\n        <label>Max Occupancy</label>\n        <input type=\"number\" id=\"cOccupancy\" value=\"2\" min=\"1\" required />\n      </div>\n      <div class=\"form-group\">\n        <label>Amenities</label>\n        <input type=\"text\" id=\"cAmenities\" placeholder=\"WiFi, AC, Private Deck\" />\n      </div>\n      <div class=\"form-group\">\n        <label>Description</label>\n        <textarea id=\"cDesc\" rows=\"2\" placeholder=\"Overview of the accommodation...\"></textarea>\n      </div>\n      <button type=\"submit\">Register Cottage</button>\n    </form>\n  </div>\n\n  <!-- 2. CREATE RESERVATION -->\n  <div class=\"card reveal stagger-1\">\n    <h2>Book Reservation</h2>\n    <form id=\"reservationForm\">\n      <div class=\"form-group\">\n        <label>Select Cottage</label>\n        <select id=\"rCottageSelect\" required>\n          <option value=\"\">Loading Cottages...</option>\n        </select>\n      </div>\n      <div class=\"form-group\">\n        <label>Guest Full Name</label>\n        <input type=\"text\" id=\"rName\" required />\n      </div>\n      <div class=\"form-group\">\n        <label>Guest Email</label>\n        <input type=\"email\" id=\"rEmail\" required />\n      </div>\n      <div class=\"form-group\">\n        <label>Guest Phone</label>\n        <input type=\"text\" id=\"rPhone\" required />\n      </div>\n      <div class=\"form-group\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n        <div>\n          <label>Check-In Date</label>\n          <input type=\"date\" id=\"rCheckIn\" required />\n        </div>\n        <div>\n          <label>Check-Out Date</label>\n          <input type=\"date\" id=\"rCheckOut\" required />\n        </div>\n      </div>\n      <div class=\"form-group\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n        <div>\n          <label>Number of Guests</label>\n          <input type=\"number\" id=\"rGuests\" value=\"1\" min=\"1\" required />\n        </div>\n        <div>\n          <label>Extra Beds (LKR 25/night)</label>\n          <input type=\"number\" id=\"rExtraBeds\" value=\"0\" min=\"0\" />\n        </div>\n      </div>\n      <div class=\"form-group\">\n        <label>Special Requests</label>\n        <input type=\"text\" id=\"rRequests\" placeholder=\"Late arrival, dietary requirements...\" />\n      </div>\n      <button type=\"submit\">Submit Reservation</button>\n    </form>\n  </div>\n\n  <!-- 3. COTTAGE INVENTORY TABLE -->\n  <div class=\"card full-width reveal\">\n    <h2>Cottage Catalog</h2>\n    <table>\n      <thead>\n        <tr>\n          <th>Code</th>\n          <th>Name</th>\n          <th>Type</th>\n          <th>Price / Night</th>\n          <th>Capacity</th>\n          <th>Status</th>\n          <th>Actions</th>\n        </tr>\n      </thead>\n      <tbody id=\"cottagesTableBody\"></tbody>\n    </table>\n  </div>\n\n  <!-- 4. RESERVATIONS MANAGEMENT TABLE -->\n  <div class=\"card full-width reveal\">\n    <h2>Reservation Lifecycle Management</h2>\n    <table>\n      <thead>\n        <tr>\n          <th>Code</th>\n          <th>Guest</th>\n          <th>Cottage</th>\n          <th>Dates</th>\n          <th>Total</th>\n          <th>Status</th>\n          <th>Actions</th>\n        </tr>\n      </thead>\n      <tbody id=\"reservationsTableBody\"></tbody>\n    </table>\n  </div>\n\n</div>\n\n<div id=\"toast\"></div>\n\n</div>\n\n<script>\n  document.addEventListener('DOMContentLoaded', function(){\n    var gate = document.getElementById('staffGate');\n    var content = document.getElementById('staffContent');\n    var pwInput = document.getElementById('gatePassword');\n    var err = document.getElementById('gateError');\n    var STAFF_PASSWORD = '5658';\n\n    function tryUnlock(){\n      if (pwInput.value === STAFF_PASSWORD) {\n        gate.classList.add('hidden');\n        content.classList.remove('locked');\n        sessionStorage.setItem('wt_staff_unlocked', '1');\n        err.textContent = '';\n      } else {\n        err.textContent = 'Incorrect password. Please try again.';\n        pwInput.value = '';\n        pwInput.focus();\n      }\n    }\n\n    if (sessionStorage.getItem('wt_staff_unlocked') === '1') {\n      gate.classList.add('hidden');\n      content.classList.remove('locked');\n    } else {\n      pwInput.focus();\n    }\n\n    document.getElementById('gateSubmit').addEventListener('click', tryUnlock);\n    pwInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });\n  });\n<\/script>\n\n<script>\n  // Works both standalone (real page reload) and embedded inside the combined artifact (parent.gotoPage)\n  function goHome(page, ev) {\n    if (window.parent && window.parent !== window && typeof window.parent.gotoPage === 'function') {\n      if (ev) ev.preventDefault();\n      window.parent.gotoPage(page);\n      return false;\n    }\n    return true;\n  }\n\n  function tickClock(){\n    const el = document.getElementById('clock');\n    if (el) el.textContent = new Date().toLocaleString('en-GB', { weekday:'short', hour:'2-digit', minute:'2-digit' });\n  }\n  tickClock(); setInterval(tickClock, 30000);\n\n  const API_BASE = '/api/cottages';\n\n  // Sample data used only if the live API is unreachable, so the console still\n  // demonstrates the full workflow standalone.\n  const SAMPLE_COTTAGES = [\n    { id: 1, cottageNumber: 'COT-101', cottageName: 'Leopard Rock Villa', cottageType: 'LUXURY_SUITE', basePricePerNight: 180.00, maxOccupancy: 2, status: 'AVAILABLE' },\n    { id: 2, cottageNumber: 'COT-102', cottageName: 'Elephant Corridor Cottage', cottageType: 'DELUXE', basePricePerNight: 150.00, maxOccupancy: 3, status: 'OCCUPIED' },\n    { id: 3, cottageNumber: 'COT-103', cottageName: 'Canopy Deluxe Cottage', cottageType: 'DELUXE', basePricePerNight: 130.00, maxOccupancy: 2, status: 'AVAILABLE' },\n    { id: 4, cottageNumber: 'COT-104', cottageName: 'Riverside Family Chalet', cottageType: 'FAMILY_CHALET', basePricePerNight: 210.00, maxOccupancy: 5, status: 'AVAILABLE' }\n  ];\n  const SAMPLE_RESERVATIONS = [\n    { id: 101, reservationCode: 'RES-1001', guestName: 'Priya Ehrlich', guestEmail: 'priya@example.com', cottage: { cottageName: 'Leopard Rock Villa' }, checkInDate: '2026-10-02', checkOutDate: '2026-10-05', totalAmount: 540.00, status: 'PENDING' },\n    { id: 102, reservationCode: 'RES-1002', guestName: 'Daniel Kim', guestEmail: 'dkim@example.com', cottage: { cottageName: 'Elephant Corridor Cottage' }, checkInDate: '2026-09-20', checkOutDate: '2026-09-24', totalAmount: 600.00, status: 'CHECKED_IN' }\n  ];\n\n  let usingSample = false;\n\n  // Helper fetch function handling Spring Boot ApiResponse wrapper\n  async function apiRequest(url, options = {}) {\n    options.headers = { 'Content-Type': 'application/json', ...options.headers };\n    const res = await fetch(url, options);\n    const json = await res.json();\n    if (!res.ok || !json.success) {\n      throw new Error(json.message || 'API operation failed');\n    }\n    return json.data;\n  }\n\n  // Load Cottages\n  async function loadCottages() {\n    let cottages;\n    try {\n      cottages = await apiRequest(API_BASE);\n      usingSample = false;\n    } catch (err) {\n      cottages = SAMPLE_COTTAGES;\n      usingSample = true;\n    }\n    const tableBody = document.getElementById('cottagesTableBody');\n    const select = document.getElementById('rCottageSelect');\n\n    tableBody.innerHTML = '';\n    select.innerHTML = '<option value=\"\">-- Select Cottage --</option>';\n\n    cottages.forEach(c => {\n      tableBody.innerHTML += `\n        <tr>\n          <td><strong>${c.cottageNumber}</strong></td>\n          <td>${c.cottageName}</td>\n          <td>${c.cottageType}</td>\n          <td>LKR ${parseFloat(c.basePricePerNight).toFixed(2)}</td>\n          <td>${c.maxOccupancy} Guests</td>\n          <td><span class=\"badge badge-${c.status}\">${c.status}</span></td>\n          <td><button class=\"btn-danger\" onclick=\"deleteCottage(${c.id})\">Delete</button></td>\n        </tr>`;\n\n      if (c.status === 'AVAILABLE') {\n        select.innerHTML += `<option value=\"${c.id}\">${c.cottageName} (${c.cottageNumber}) - LKR ${c.basePricePerNight}/night</option>`;\n      }\n    });\n\n    document.getElementById('statTotal').textContent = cottages.length;\n    document.getElementById('statAvailable').textContent = cottages.filter(c => c.status === 'AVAILABLE').length;\n  }\n\n  // Delete Cottage\n  async function deleteCottage(id) {\n    if (!confirm('Are you sure you want to delete this cottage? This cannot be undone.')) return;\n    try {\n      await apiRequest(`${API_BASE}/${id}`, { method: 'DELETE' });\n      toast('Cottage deleted successfully');\n      loadCottages();\n    } catch (err) {\n      toast(err.message, true);\n    }\n  }\n\n  // Add New Cottage\n  document.getElementById('addCottageForm').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const payload = {\n      cottageNumber: document.getElementById('cNumber').value,\n      cottageName: document.getElementById('cName').value,\n      cottageType: document.getElementById('cType').value,\n      basePricePerNight: parseFloat(document.getElementById('cPrice').value),\n      maxOccupancy: parseInt(document.getElementById('cOccupancy').value),\n      amenities: document.getElementById('cAmenities').value,\n      description: document.getElementById('cDesc').value,\n      status: 'AVAILABLE'\n    };\n\n    try {\n      await apiRequest(API_BASE, { method: 'POST', body: JSON.stringify(payload) });\n      toast('Cottage added successfully!');\n      document.getElementById('addCottageForm').reset();\n      loadCottages();\n    } catch (err) {\n      toast(err.message, true);\n    }\n  });\n\n  // Submit Reservation\n  document.getElementById('reservationForm').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const payload = {\n      cottageId: parseInt(document.getElementById('rCottageSelect').value),\n      guestName: document.getElementById('rName').value,\n      guestEmail: document.getElementById('rEmail').value,\n      guestPhone: document.getElementById('rPhone').value,\n      checkInDate: document.getElementById('rCheckIn').value,\n      checkOutDate: document.getElementById('rCheckOut').value,\n      numberOfGuests: parseInt(document.getElementById('rGuests').value),\n      extraBeds: parseInt(document.getElementById('rExtraBeds').value) || 0,\n      specialRequests: document.getElementById('rRequests').value\n    };\n\n    try {\n      await apiRequest(`${API_BASE}/reservations`, { method: 'POST', body: JSON.stringify(payload) });\n      toast('Reservation submitted successfully!');\n      document.getElementById('reservationForm').reset();\n      loadReservations();\n    } catch (err) {\n      toast(err.message, true);\n    }\n  });\n\n  // Load Reservations\n  async function loadReservations() {\n    let reservations;\n    try {\n      reservations = await apiRequest(`${API_BASE}/reservations`);\n    } catch (err) {\n      reservations = SAMPLE_RESERVATIONS;\n    }\n    const tableBody = document.getElementById('reservationsTableBody');\n    tableBody.innerHTML = '';\n\n    reservations.forEach(r => {\n      tableBody.innerHTML += `\n        <tr>\n          <td><strong>${r.reservationCode}</strong></td>\n          <td>${r.guestName}<br><small style=\"color:var(--muted)\">${r.guestEmail}</small></td>\n          <td>${r.cottage ? r.cottage.cottageName : 'N/A'}</td>\n          <td>${r.checkInDate} to ${r.checkOutDate}</td>\n          <td>LKR ${parseFloat(r.totalAmount).toFixed(2)}</td>\n          <td><span class=\"badge badge-${r.status}\">${r.status}</span></td>\n          <td>${renderActionButtons(r)}</td>\n        </tr>`;\n    });\n\n    document.getElementById('statPending').textContent = reservations.filter(r => r.status === 'PENDING').length;\n    document.getElementById('statCheckedIn').textContent = reservations.filter(r => r.status === 'CHECKED_IN').length;\n  }\n\n  // Render buttons based on lifecycle state\n  function renderActionButtons(r) {\n    if (r.status === 'PENDING') {\n      return `\n        <button onclick=\"approveRes(${r.id})\">Approve</button>\n        <button class=\"btn-danger\" onclick=\"rejectRes(${r.id})\">Reject</button>`;\n    } else if (r.status === 'CONFIRMED') {\n      return `<button onclick=\"checkInRes(${r.id})\">Check-In</button>`;\n    } else if (r.status === 'CHECKED_IN') {\n      return `<button class=\"btn-secondary\" onclick=\"checkOutRes(${r.id})\">Check-Out</button>`;\n    }\n    return `<small style=\"color:var(--muted)\">N/A</small>`;\n  }\n\n  // Action handlers matching DTO structures\n  async function approveRes(id) {\n    try {\n      await apiRequest(`${API_BASE}/reservations/${id}/approve`, {\n        method: 'PUT',\n        body: JSON.stringify({ approver: 'Cottage Manager', notes: 'Approved via admin console' })\n      });\n      loadReservations();\n    } catch (err) { toast(err.message, true); }\n  }\n\n  async function rejectRes(id) {\n    const reason = prompt('Enter rejection reason:');\n    if (!reason) return;\n    try {\n      await apiRequest(`${API_BASE}/reservations/${id}/reject`, {\n        method: 'PUT',\n        body: JSON.stringify({ rejecter: 'Cottage Manager', reason })\n      });\n      loadReservations();\n    } catch (err) { toast(err.message, true); }\n  }\n\n  async function checkInRes(id) {\n    const keyCard = prompt('Enter Keycard Number:', 'KEY-' + id);\n    if (!keyCard) return;\n    try {\n      await apiRequest(`${API_BASE}/reservations/${id}/check-in`, {\n        method: 'POST',\n        body: JSON.stringify({ keyCardNumber: keyCard, notes: 'Standard Check-In' })\n      });\n      loadReservations();\n      loadCottages();\n    } catch (err) { toast(err.message, true); }\n  }\n\n  async function checkOutRes(id) {\n    const hasDamage = confirm('Was room damage identified during inspection?');\n    let damageFee = 0;\n    let damageDescription = '';\n\n    if (hasDamage) {\n      damageFee = parseFloat(prompt('Enter damage penalty amount (LKR):', '50.00')) || 0;\n      damageDescription = prompt('Enter damage details:', 'Damaged furniture');\n    }\n\n    try {\n      await apiRequest(`${API_BASE}/reservations/${id}/check-out`, {\n        method: 'POST',\n        body: JSON.stringify({\n          damageAssessed: hasDamage,\n          damageFee: damageFee,\n          damageDescription: damageDescription,\n          notes: 'Standard Check-Out'\n        })\n      });\n      loadReservations();\n      loadCottages();\n    } catch (err) { toast(err.message, true); }\n  }\n\n  function toast(msg, isError) {\n    const t = document.getElementById('toast');\n    t.textContent = msg;\n    t.style.borderColor = isError ? '#991b1b' : 'var(--accent)';\n    t.style.display = 'block';\n    setTimeout(() => { t.style.display = 'none'; }, 3400);\n  }\n\n  // Initial initialization\n  document.addEventListener('DOMContentLoaded', () => {\n    loadCottages();\n    loadReservations();\n  });\n<\/script>\n\n\n<!-- ===== Shared cross-page + animation kit (auto-injected) ===== -->\n<style id=\"wt-anim-style\">\n  @keyframes wtFadeUp { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }\n  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);}\n  .reveal.in-view{opacity:1; transform:translateY(0);}\n  .reveal.stagger-1{transition-delay:.06s;} .reveal.stagger-2{transition-delay:.14s;}\n  .reveal.stagger-3{transition-delay:.22s;} .reveal.stagger-4{transition-delay:.30s;}\n  .reveal.stagger-5{transition-delay:.38s;} .reveal.stagger-6{transition-delay:.46s;}\n  .hero-anim{opacity:0; transform:translateY(18px); animation:wtFadeUp .85s cubic-bezier(.16,1,.3,1) forwards;}\n  .hero-anim.d1{animation-delay:.05s;} .hero-anim.d2{animation-delay:.20s;}\n  .hero-anim.d3{animation-delay:.35s;} .hero-anim.d4{animation-delay:.50s;}\n</style>\n<script>\n(function(){\n  function initReveal(){\n    var els = document.querySelectorAll('.reveal');\n    els.forEach(function(el){\n      var r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92 && r.bottom > 0) el.classList.add('in-view');\n    });\n    if (window.__wtIO) { try { window.__wtIO.disconnect(); } catch(e){} }\n    var io = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('.reveal:not(.in-view)').forEach(function(el){ io.observe(el); });\n    window.__wtIO = io;\n  }\n  function playHero(){\n    document.querySelectorAll('.hero-anim').forEach(function(el){\n      el.style.animation = 'none';\n      void el.offsetWidth;\n      el.style.animation = '';\n    });\n  }\n  function countUp(el){\n    if (el.dataset.counted) return;\n    var raw = (el.textContent || '').trim();\n    var target = parseFloat(raw.replace(/[^0-9.]/g, ''));\n    if (!isFinite(target)) return;\n    el.dataset.counted = '1';\n    var suffix = raw.replace(/[0-9.,]/g, '');\n    var t0 = null, dur = 1100;\n    function step(ts){\n      if (!t0) t0 = ts;\n      var p = Math.min(1, (ts - t0) / dur);\n      var eased = 1 - Math.pow(1 - p, 3);\n      var val = Math.round(target * eased);\n      el.textContent = val + suffix;\n      if (p < 1) requestAnimationFrame(step);\n      else el.textContent = raw;\n    }\n    requestAnimationFrame(step);\n  }\n  function initCounters(){\n    var nums = document.querySelectorAll('.figure, .stat-box .n');\n    if (!nums.length) return;\n    var io2 = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ countUp(e.target); io2.unobserve(e.target); } });\n    }, { threshold: 0.4 });\n    nums.forEach(function(el){ io2.observe(el); });\n  }\n\n  // Cross-page navigation: works standalone (real files) and embedded (single-file artifact)\n  var PAGE_MAP = { 'home.html':'home', 'welcome.html':'welcome', 'room.html':'room', 'staff.html':'staff', 'index.html':'staff' };\n  document.addEventListener('click', function(e){\n    var a = e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];\n    if (PAGE_MAP[href] && window.parent && window.parent !== window && typeof window.parent.gotoPage === 'function') {\n      e.preventDefault();\n      window.parent.gotoPage(PAGE_MAP[href]);\n    }\n  }, true);\n\n  function hideEmbeddedNav(){\n    if (window.self === window.top) return;\n    document.querySelectorAll('.site-nav, .top-bar, .site-utility-bar').forEach(function(n){ n.style.display = 'none'; });\n    document.documentElement.classList.add('wt-embedded');\n  }\n\n  document.addEventListener('DOMContentLoaded', function(){\n    hideEmbeddedNav();\n    initReveal();\n    initCounters();\n    playHero();\n  });\n  window.initReveal = initReveal;\n  window.playHero = playHero;\n})();\n<\/script>\n\n</body>\n</html>\n"};
</script>
<script>
    var PAGES = ['home','welcome','room','staff'];
    var current = 'home';
    var loadedCount = 0;

    function markLoaded(){
        loadedCount++;
        if (loadedCount >= PAGES.length) {
            setTimeout(function(){ document.getElementById('bootLoader').classList.add('hide'); }, 250);
        }
    }

    PAGES.forEach(function(p){
        var el = document.getElementById('iframe-' + p);
        el.addEventListener('load', markLoaded);
        el.srcdoc = window.__WT_SRC__[p];
    });

    window.gotoPage = function(page){
        if (!PAGES.includes(page) || page === current) return;
        document.getElementById('frame-' + current).classList.remove('active');
        document.getElementById('frame-' + page).classList.add('active');
        document.querySelectorAll('#masterNav button').forEach(function(b){
            b.classList.toggle('active', b.getAttribute('data-page') === page);
        });
        current = page;
        var iframe = document.getElementById('iframe-' + page);
        try {
            if (iframe.contentWindow) {
                iframe.contentWindow.initReveal && iframe.contentWindow.initReveal();
                iframe.contentWindow.playHero && iframe.contentWindow.playHero();
            }
        } catch(e) {}
        window.scrollTo(0,0);
    };

    document.querySelectorAll('#masterNav button').forEach(function(btn){
        btn.addEventListener('click', function(){ window.gotoPage(btn.getAttribute('data-page')); });
    });
</script>
