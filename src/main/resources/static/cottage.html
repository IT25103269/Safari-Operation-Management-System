    <style>
        :root{
            --primary:#0f2318; --secondary:#284b36; --accent:#d4af37; --cream:#fbf9f5;
            --transition: all .35s cubic-bezier(.16,1,.3,1);
        }
        *{box-sizing:border-box;}
        html,body{margin:0;height:100%;background:var(--primary);font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;}

        /* ===== Master nav ===== */
        #masterNav{
            position:fixed; top:0; left:0; right:0; z-index:1000;
            display:flex; align-items:center; justify-content:space-between;
            padding:14px 32px; background:rgba(9,20,14,.96); backdrop-filter:blur(10px);
            border-bottom:1px solid rgba(212,175,55,.25);
            transform:translateY(0); transition:var(--transition);
        }
        #masterNav .brand{
            font-family:'Playfair Display',serif; color:#fff; font-size:17px; letter-spacing:.6px;
            display:flex; align-items:baseline; gap:6px;
        }
        #masterNav .brand span{color:var(--accent);}
        #masterNav .links{display:flex; gap:6px; background:rgba(255,255,255,.06); padding:4px; border-radius:30px; border:1px solid rgba(255,255,255,.08);}
        #masterNav button{
            appearance:none; border:none; background:transparent; color:#c6d2cb; font-family:inherit;
            font-size:12.5px; font-weight:700; letter-spacing:.3px; padding:9px 18px; border-radius:24px;
            cursor:pointer; transition:var(--transition); position:relative;
        }
        #masterNav button:hover{ color:#fff; }
        #masterNav button.active{ background:var(--accent); color:var(--primary); }
        #masterNav .progress{
            position:absolute; bottom:0; left:0; height:2px; width:0%; background:var(--accent);
            transition:width .5s cubic-bezier(.16,1,.3,1);
        }

        /* ===== Page stage ===== */
        #stage{ position:fixed; top:0; left:0; right:0; bottom:0; }
        .page-frame{
            position:absolute; inset:0; opacity:0; visibility:hidden; pointer-events:none;
            transform:translateY(16px) scale(.995);
            transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1), visibility 0s linear .5s;
        }
        .page-frame.active{
            opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0) scale(1);
            transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1), visibility 0s linear 0s;
        }
        .page-frame iframe{ width:100%; height:100%; border:none; display:block; background:var(--cream); }

        /* ===== Boot loader ===== */
        #bootLoader{
            position:fixed; inset:0; z-index:2000; background:var(--primary);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
            transition:opacity .6s ease, visibility 0s linear .6s;
        }
        #bootLoader.hide{ opacity:0; visibility:hidden; }
        #bootLoader .mark{ font-family:'Playfair Display',serif; color:#fff; font-size:26px; letter-spacing:1px; }
        #bootLoader .mark span{ color:var(--accent); }
        #bootLoader .bar{ width:180px; height:2px; background:rgba(255,255,255,.15); border-radius:2px; overflow:hidden; }
        #bootLoader .bar i{ display:block; height:100%; width:40%; background:var(--accent); animation:wtLoad 1.1s ease-in-out infinite; }
        @keyframes wtLoad{ 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }

        @media (max-width:720px){
            #masterNav{ padding:12px 16px; }
            #masterNav .brand{ font-size:14px; }
            #masterNav button{ padding:8px 12px; font-size:11px; }
        }
    </style>
</head>

r-side .credit{writing-mode:vertical-rl;font-size:12px;letter-spacing:2px;color:#c6d2cb;transform:rotate(180deg);}\n\n  /* ===== Field metrics strip ===== */\n  .metrics{background:var(--primary);border-top:1px solid rgba(212,175,55,.25);padding:34px 60px;\n    display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}\n  .metric{color:#fff;padding:0 20px;border-left:1px solid rgba(255,255,255,.12);}\n  .metric:first-child{border-left:none;padding-left:0;}\n  .metric .figure{font-family:'Playfair Display',serif;font-size:38px;color:var(--accent);}\n  .metric .cap{font-size:12.5px;color:#c6d2cb;margin-top:6px;max-width:180px;}\n\n  /* ===== Section shell ===== */\n  section.wrap{max-width:1320px;margin:0 auto;padding:110px 60px;}\n  .eyebrow{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:14px;}\n  h2.head{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(30px,4vw,48px);color:var(--primary);margin:0 0 18px;max-width:640px;}\n  p.intro{color:var(--muted);max-width:560px;font-size:16.5px;}\n\n  /* ===== Field notes (dispatches) ===== */\n  .notes{display:grid;grid-template-columns:1.15fr .85fr .85fr;gap:2px;margin-top:60px;background:#e4e0d4;}\n  .note{background:var(--cream);position:relative;overflow:hidden;}\n  .note .ph{aspect-ratio:4/5;background-size:cover;background-position:center;}\n  .note:first-child .ph{aspect-ratio:auto;height:100%;min-height:560px;}\n  .note-body{padding:26px 28px 32px;}\n  .note .tag{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;}\n  .note h3{font-family:'Playfair Display',serif;font-size:23px;margin:10px 0 10px;color:var(--primary);font-weight:600;line-height:1.25;}\n  .note:first-child h3{font-size:30px;}\n  .note p{font-size:14.5px;color:var(--muted);margin:0;}\n  .note .read{display:inline-block;margin-top:16px;font-size:12.5px;font-weight:700;color:var(--primary);border-bottom:1.5px solid var(--accent);padding-bottom:2px;}\n\n  /* ===== Split feature ===== */\n  .feature{display:grid;grid-template-columns:.95fr 1.05fr;gap:0;background:var(--secondary);border-radius:6px;overflow:hidden;}\n  .feature-img{background:url('https://images.unsplash.com/photo-1733235015164-7210178aed4b?auto=format&fit=crop&w=1100&q=80') center/cover;min-height:500px;}\n  .feature-text{padding:70px 64px;color:#f3f0e6;display:flex;flex-direction:column;justify-content:center;}\n  .feature-text .eyebrow{color:var(--accent);}\n  .feature-text h2{font-family:'Playfair Display',serif;font-size:34px;color:#fff;margin:0 0 20px;font-weight:600;line-height:1.2;}\n  .feature-text p{color:#d3dcd5;font-size:15.5px;margin-bottom:14px;}\n  .feature-links{margin-top:26px;display:flex;gap:28px;}\n  .feature-links a{font-size:13px;font-weight:700;color:var(--accent);border-bottom:1.5px solid rgba(212,175,55,.5);padding-bottom:3px;}\n\n  /* ===== Testimonial ===== */\n  .testimonial{text-align:center;max-width:760px;margin:0 auto;padding:120px 60px;}\n  .testimonial q{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(24px,3vw,34px);color:var(--primary);line-height:1.5;quotes:none;display:block;}\n  .testimonial .who{margin-top:26px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.5px;}\n\n  /* ===== CTA band ===== */\n  .cta-band{position:relative;padding:140px 60px;text-align:center;color:#fff;overflow:hidden;}\n  .cta-band .bg{position:absolute;inset:0;z-index:0;background:\n      linear-gradient(180deg, rgba(9,20,14,.55), rgba(9,20,14,.86)),\n      url('https://images.unsplash.com/photo-1677741447050-e166cf1a1f14?auto=format&fit=crop&w=1800&q=80') center/cover;}\n  .cta-band .in{position:relative;z-index:1;}\n  .cta-band h2{font-family:'Playfair Display',serif;font-size:clamp(30px,4vw,50px);margin:0 0 22px;max-width:700px;margin-left:auto;margin-right:auto;font-weight:600;}\n  .cta-band p{color:#dfe6e1;max-width:520px;margin:0 auto 36px;}\n\n  /* ===== Footer ===== */\n  footer{background:var(--primary);color:#c6d2cb;padding:64px 60px 34px;}\n  .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;max-width:1320px;margin:0 auto;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1);}\n  footer .brand{margin-bottom:14px;}\n  footer p{font-size:13.5px;color:#96a89d;max-width:280px;}\n  footer h4{font-size:12px;letter-spacing:1px;color:#fff;margin:0 0 16px;text-transform:uppercase;}\n  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}\n  footer a{font-size:13.5px;color:#a9bcb0;}\n  footer a:hover{color:var(--accent);}\n  .foot-bottom{max-width:1320px;margin:24px auto 0;display:flex;justify-content:space-between;font-size:12px;color:#7c8f83;}\n\n  @media(max-width:900px){\n    .site-nav{padding:16px 24px;} .site-links{display:none;}\n    .cover{padding:0 24px 50px;} .issue-line{padding-top:110px;flex-direction:column;gap:8px;}\n    .metrics{grid-template-columns:repeat(2,1fr);padding:30px 24px;}\n    section.wrap{padding:70px 24px;}\n    .notes{grid-template-columns:1fr;} .note:first-child .ph{min-height:320px;}\n    .feature{grid-template-columns:1fr;} .feature-text{padding:44px 30px;}\n    .cover-side{display:none;}\n    .foot-grid{grid-template-columns:1fr 1fr;}\n  }\n</style>\n</head>\n<body>\n\n<nav class=\"site-nav\">\n  <a href=\"home.html\" class=\"brand\">\ud83c\udf3f LANKA WILD TRAILS <em>| SANCTUARY</em></a>\n  <div class=\"site-links\">\n    <a href=\"home.html\" class=\"current\">Journal</a>\n    <a href=\"welcome.html\">The Sanctuary</a>\n    <a href=\"room.html\">Cottages</a>\n    <a href=\"index.html\" class=\"staff-link\">Staff Portal</a>\n    <a href=\"room.html\" class=\"nav-cta\">Reserve a Stay</a>\n  </div>\n</nav>\n\n<header class=\"cover\">\n  <div class=\"cover-bg\"></div>\n  <div class=\"issue-line\">\n    <span class=\"kicker\">FIELD DISPATCH \u2014 SOUTHERN PROVINCE, SRI LANKA</span>\n    <span class=\"date\">Season 2026 / No. 04</span>\n  </div>\n  <div class=\"cover-title\">\n    <h1 class=\"hero-anim d1\">The Wild Still Keeps Its Own Hours</h1>\n    <p class=\"lede hero-anim d2\">Sixty private acres bordering Yala's buffer zone, where elephant corridors run beside teak-and-glass cottages and every itinerary bends around what the forest decides to show you.</p>\n    <div class=\"cover-cta hero-anim d3\">\n      <a href=\"room.html\" class=\"btn-solid\">Reserve a Cottage</a>\n      <a href=\"welcome.html\" class=\"btn-ghost\">Meet the Sanctuary</a>\n    </div>\n  </div>\n  <div class=\"cover-side\">\n    <span class=\"num\">Vol. II</span>\n    <span class=\"credit\">PHOTOGRAPHED ON LOCATION AT BLOCK 1, YALA</span>\n  </div>\n</header>\n\n<div class=\"metrics\">\n  <div class=\"metric reveal\"><div class=\"figure\">60</div><div class=\"cap\">Private acres bordering the national park buffer zone</div></div>\n  <div class=\"metric reveal stagger-1\"><div class=\"figure\">14</div><div class=\"cap\">Cottages, each built around a resident tree or water view</div></div>\n  <div class=\"metric reveal stagger-2\"><div class=\"figure\">126</div><div class=\"cap\">Leopard sightings logged by our trackers last season</div></div>\n  <div class=\"metric reveal stagger-3\"><div class=\"figure\">9</div><div class=\"cap\">Endemic bird species recorded on the property this year</div></div>\n</div>\n\n<section class=\"wrap\">\n  <span class=\"eyebrow\">From the field</span>\n  <h2 class=\"head\">Dispatches from the buffer zone</h2>\n  <p class=\"intro\">Notes from our trackers and resident naturalist on what's moving through the sanctuary this month \u2014 read before you plan your first walk.</p>\n\n  <div class=\"notes\">\n    <div class=\"note reveal\">\n      <div class=\"ph\" style=\"background-image:url('https://images.unsplash.com/photo-1760570317591-1a52e6ea1e8e?auto=format&fit=crop&w=900&q=80');\"></div>\n      <div class=\"note-body\">\n        <span class=\"tag\">MORNING TRAIL</span>\n        <h3>A herd of nineteen crossed the waterhole at first light</h3>\n        <p>Our tracker Sunil counted the largest elephant gathering of the season just past the eastern cottages \u2014 no jeep required, only a torch and patience before sunrise.</p>\n        <a class=\"read\" href=\"welcome.html\">Read the sighting log \u2192</a>\n      </div>\n    </div>\n    <div class=\"note reveal stagger-2\">\n      <div class=\"ph\" style=\"background-image:url('https://images.unsplash.com/photo-1566708627877-859df13ae63e?auto=format&fit=crop&w=700&q=80');\"></div>\n      <div class=\"note-body\">\n        <span class=\"tag\">DUSK WATCH</span>\n        <h3>Leopard Rock, after the rains</h3>\n        <p>The granite outcrop above cottage nine has become the season's most reliable perch \u2014 three confirmed sightings in the last fortnight alone.</p>\n        <a class=\"read\" href=\"room.html\">See the closest cottage \u2192</a>\n      </div>\n    </div>\n    <div class=\"note reveal stagger-4\">\n      <div class=\"ph\" style=\"background-image:url('https://images.unsplash.com/photo-1733235015164-7210178aed4b?auto=format&fit=crop&w=700&q=80');\"></div>\n      <div class=\"note-body\">\n        <span class=\"tag\">CANOPY NOTES</span>\n        <h3>What the hornbills are telling us about the rains</h3>\n        <p>Early nesting this year, our naturalist notes, points to an earlier monsoon \u2014 good reason to book the canopy walk before the season turns.</p>\n        <a class=\"read\" href=\"welcome.html\">Read the field notes \u2192</a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"wrap\" style=\"padding-top:0;\">\n  <div class=\"feature reveal\">\n    <div class=\"feature-img\"></div>\n    <div class=\"feature-text\">\n      <span class=\"eyebrow\">Why stay here</span>\n      <h2>Built for people who'd rather wait for the forest than the wifi</h2>\n      <p>Every cottage sits at least forty metres from its nearest neighbour, oriented toward a specific tree, waterhole, or ridge line chosen before a single wall went up. Trackers live on-site, not on call.</p>\n      <p>Rates include two guided walks daily, a resident naturalist briefing each evening, and full board sourced from our own kitchen garden.</p>\n      <div class=\"feature-links\">\n        <a href=\"room.html\">View cottages & rates</a>\n        <a href=\"welcome.html\">Our conservation work</a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"testimonial reveal\">\n  <q>We came for the elephants and stayed awake half the night for the sound of it \u2014 no engine, no generator hum, just the forest doing what it does.</q>\n  <div class=\"who\">\u2014 Priya Ehrlich, three nights in Cottage Seven</div>\n</section>\n\n<div class=\"cta-band reveal\">\n  <div class=\"bg\"></div>\n  <div class=\"in\">\n    <h2>Fourteen cottages. One buffer zone. Book before the season fills.</h2>\n    <p>Reserve directly with our team \u2014 real-time availability, no booking fees, and a tracker assigned to your stay from the day you arrive.</p>\n    <a href=\"room.html\" class=\"btn-solid\">Check Availability</a>\n  </div>\n</div>\n\n<footer>\n  <div class=\"foot-grid\">\n    <div>\n      <div class=\"brand\">\ud83c\udf3f LANKA WILD TRAILS</div>\n      <p>A sixty-acre private sanctuary on the northern buffer of Yala National Park, Sri Lanka. Fourteen cottages, working conservation land.</p>\n    </div>\n    <div>\n      <h4>Explore</h4>\n      <ul>\n        <li><a href=\"home.html\">Journal</a></li>\n        <li><a href=\"welcome.html\">The Sanctuary</a></li>\n        <li><a href=\"room.html\">Cottages & Rates</a></li>\n      </ul>\n    </div>\n    <div>\n      <h4>Stay</h4>\n      <ul>\n        <li><a href=\"room.html\">Check Availability</a></li>\n        <li><a href=\"index.html\">Manage a Reservation</a></li>\n        <li><a href=\"welcome.html\">Conservation Fee</a></li>\n      </ul>\n    </div>\n    <div>\n      <h4>Contact</h4>\n      <ul>\n        <li><a href=\"tel:+94770000000\">+94 77 000 0000</a></li>\n        <li><a href=\"mailto:stay@lankawildtrails.lk\">stay@lankawildtrails.lk</a></li>\n        <li><a href=\"#\">Block 1, Yala Buffer Zone, LK</a></li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Lanka Wild Trails Sanctuary</span>\n    <span>Built for the Software Engineering module \u2014 Cottage Reservation System</span>\n  </div>\n</footer>\n\n\n<!-- ===== Shared cross-page + animation kit (auto-injected) ===== -->\n<style id=\"wt-anim-style\">\n  @keyframes wtFadeUp { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }\n  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);}\n  .reveal.in-view{opacity:1; transform:translateY(0);}\n  .reveal.stagger-1{transition-delay:.06s;} .reveal.stagger-2{transition-delay:.14s;}\n  .reveal.stagger-3{transition-delay:.22s;} .reveal.stagger-4{transition-delay:.30s;}\n  .reveal.stagger-5{transition-delay:.38s;} .reveal.stagger-6{transition-delay:.46s;}\n  .hero-anim{opacity:0; transform:translateY(18px); animation:wtFadeUp .85s cubic-bezier(.16,1,.3,1) forwards;}\n  .hero-anim.d1{animation-delay:.05s;} .hero-anim.d2{animation-delay:.20s;}\n  .hero-anim.d3{animation-delay:.35s;} .hero-anim.d4{animation-delay:.50s;}\n</style>\n<script>\n(function(){\n  function initReveal(){\n    var els = document.querySelectorAll('.reveal');\n    els.forEach(function(el){\n      var r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92 && r.bottom > 0) el.classList.add('in-view');\n    });\n    if (window.__wtIO) { try { window.__wtIO.disconnect(); } catch(e){} }\n    var io = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('.reveal:not(.in-view)').forEach(function(el){ io.observe(el); });\n    window.__wtIO = io;\n  }\n  function playHero(){\n    document.querySelectorAll('.hero-anim').forEach(function(el){\n      el.style.animation = 'none';\n      void el.offsetWidth;\n      el.style.animation = '';\n    });\n  }\n  function countUp(el){\n    if (el.dataset.counted) return;\n    var raw = (el.textContent || '').trim();\n    var target = parseFloat(raw.replace(/[^0-9.]/g, ''));\n    if (!isFinite(target)) return;\n    el.dataset.counted = '1';\n    var suffix = raw.replace(/[0-9.,]/g, '');\n    var t0 = null, dur = 1100;\n    function step(ts){\n      if (!t0) t0 = ts;\n      var p = Math.min(1, (ts - t0) / dur);\n      var eased = 1 - Math.pow(1 - p, 3);\n      var val = Math.round(target * eased);\n      el.textContent = val + suffix;\n      if (p < 1) requestAnimationFrame(step);\n      else el.textContent = raw;\n    }\n    requestAnimationFrame(step);\n  }\n  function initCounters(){\n    var nums = document.querySelectorAll('.figure, .stat-box .n');\n    if (!nums.length) return;\n    var io2 = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ countUp(e.target); io2.unobserve(e.target); } });\n    }, { threshold: 0.4 });\n    nums.forEach(function(el){ io2.observe(el); });\n  }\n\n  // Cross-page navigation: works standalone (real files) and embedded (single-file artifact)\n  var PAGE_MAP = { 'home.html':'home', 'welcome.html':'welcome', 'room.html':'room', 'staff.html':'staff', 'index.html':'staff' };\n  document.addEventListener('click', function(e){\n    var a = e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];\n    if (PAGE_MAP[href] && window.parent && window.parent !== window && typeof window.parent.gotoPage === 'function') {\n      e.preventDefault();\n      window.parent.gotoPage(PAGE_MAP[href]);\n    }\n  }, true);\n\n  function hideEmbeddedNav(){\n    if (window.self === window.top) return;\n    document.querySelectorAll('.site-nav, .top-bar, .site-utility-bar').forEach(function(n){ n.style.display = 'none'; });\n    document.documentElement.classList.add('wt-embedded');\n  }\n\n  document.addEventListener('DOMContentLoaded', function(){\n    hideEmbeddedNav();\n    initReveal();\n    initCounters();\n    playHero();\n  });\n  window.initReveal = initReveal;\n  window.playHero = playHero;\n})();\n<\/script>\n\n</body>\n</html>\n", "welcome": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>The Sanctuary | Lanka Wild Trails</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --primary:#0f2318; --secondary:#284b36; --accent:#d4af37;\n    --cream:#fbf9f5; --text:#1c2620; --muted:#5a6e62;\n    --shadow:0 20px 40px -15px rgba(15,35,24,0.12);\n    --transition:all .4s cubic-bezier(.16,1,.3,1);\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text);line-height:1.7;}\n  a{text-decoration:none;color:inherit;}\n  img{display:block;max-width:100%;}\n\n  .site-nav{position:sticky;top:0;z-index:80;display:flex;align-items:center;justify-content:space-between;\n    padding:18px 60px;background:rgba(15,35,24,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,175,55,.2);}\n  .brand{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:1.5px;color:#fff;display:flex;align-items:baseline;gap:8px;}\n  .brand em{font-style:normal;color:var(--accent);}\n  .site-links{display:flex;align-items:center;gap:36px;}\n  .site-links a{font-size:13px;font-weight:600;letter-spacing:.4px;color:#d7e0da;transition:var(--transition);}\n  .site-links a:hover{color:#fff;}\n  .site-links a.current{color:var(--accent);}\n  .nav-cta{background:var(--accent);color:var(--primary);padding:10px 22px;border-radius:30px;font-size:12.5px;font-weight:700;letter-spacing:.5px;}\n  .nav-cta:hover{background:#e4c25e;}\n  .staff-link{font-size:11.5px;color:#8fa398;border:1px solid rgba(255,255,255,.18);padding:8px 14px;border-radius:30px;}\n  .staff-link:hover{color:#fff;border-color:rgba(255,255,255,.4);}\n\n  /* ===== Welcome split hero ===== */\n  .welcome-hero{background:var(--primary);padding:80px 60px 0;}\n  .wh-grid{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:center;padding-bottom:80px;}\n  .wh-text .eyebrow{font-size:13px;letter-spacing:2px;color:#9db6a6;margin-bottom:18px;}\n  .wh-text h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5vw,58px);color:#fff;margin:0 0 24px;line-height:1.08;font-weight:700;}\n  .wh-text p{color:#c6d2cb;font-size:16px;max-width:420px;}\n  .wh-images{display:grid;grid-template-columns:1fr 1fr;gap:18px;}\n  .wh-images .tall{grid-row:span 2;background:url('https://images.unsplash.com/photo-1702014861736-d62834317c5e?auto=format&fit=crop&w=700&q=80') center/cover;border-radius:6px;min-height:420px;}\n  .wh-images .sq1{background:url('https://images.unsplash.com/photo-1760570317591-1a52e6ea1e8e?auto=format&fit=crop&w=500&q=80') center/cover;border-radius:6px;min-height:195px;}\n  .wh-images .sq2{background:url('https://images.unsplash.com/photo-1733235015164-7210178aed4b?auto=format&fit=crop&w=500&q=80') center/cover;border-radius:6px;min-height:195px;}\n\n  /* ===== Lush banner ===== */\n  .lush-banner{position:relative;min-height:60vh;display:flex;align-items:flex-end;padding:60px;color:#fff;}\n  .lush-banner .bg{position:absolute;inset:0;z-index:0;background:\n    linear-gradient(0deg, rgba(9,20,14,.9) 0%, rgba(9,20,14,.15) 55%),\n    url('https://images.unsplash.com/photo-1566708627877-859df13ae63e?auto=format&fit=crop&w=1800&q=80') center/cover;}\n  .lush-in{position:relative;z-index:1;max-width:560px;}\n  .lush-in .eyebrow{font-size:13px;letter-spacing:2px;color:var(--accent);margin-bottom:14px;}\n  .lush-in h2{font-family:'Playfair Display',serif;font-size:clamp(28px,3.6vw,40px);margin:0 0 20px;font-weight:600;line-height:1.2;}\n  .lush-in p{color:#dfe6e1;font-size:15.5px;margin-bottom:28px;}\n  .btn-solid{display:inline-block;background:var(--accent);color:var(--primary);padding:15px 30px;border-radius:4px;font-weight:700;font-size:13.5px;letter-spacing:.6px;transition:var(--transition);}\n  .btn-solid:hover{background:#fff;transform:translateY(-2px);}\n\n  /* ===== Story / values ===== */\n  section.wrap{max-width:1320px;margin:0 auto;padding:110px 60px;}\n  .eyebrow{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:14px;}\n  h2.head{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(28px,3.6vw,42px);color:var(--primary);margin:0 0 18px;max-width:620px;}\n  p.intro{color:var(--muted);max-width:560px;font-size:16.5px;}\n\n  .story{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start;margin-top:20px;}\n  .story-copy p{color:var(--muted);font-size:15.5px;margin-bottom:18px;}\n  .story-copy p:first-of-type{font-family:'Playfair Display',serif;font-style:italic;font-size:21px;color:var(--primary);line-height:1.5;}\n  .story-stats{display:grid;gap:26px;padding-left:36px;border-left:1px solid #e2ded0;}\n  .story-stat .figure{font-family:'Playfair Display',serif;font-size:32px;color:var(--primary);}\n  .story-stat .cap{font-size:13px;color:var(--muted);margin-top:4px;}\n\n  /* ===== Values grid ===== */\n  .values{background:#f3efe4;padding:110px 60px;}\n  .values-grid{max-width:1320px;margin:60px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ddd7c4;}\n  .value-card{background:#f3efe4;padding:38px 34px;}\n  .value-card .ic{font-size:26px;margin-bottom:18px;}\n  .value-card h4{font-family:'Playfair Display',serif;font-size:19px;color:var(--primary);margin:0 0 10px;font-weight:600;}\n  .value-card p{font-size:13.5px;color:var(--muted);margin:0;}\n\n  /* ===== Amenities strip ===== */\n  .amenities{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1px solid #e2ded0;border-bottom:1px solid #e2ded0;margin-top:0;}\n  .amenity{padding:30px 18px;text-align:center;border-left:1px solid #e2ded0;}\n  .amenity:first-child{border-left:none;}\n  .amenity .ic{font-size:22px;}\n  .amenity .lbl{font-size:11.5px;letter-spacing:.4px;color:var(--muted);margin-top:10px;}\n\n  footer{background:var(--primary);color:#c6d2cb;padding:64px 60px 34px;}\n  .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;max-width:1320px;margin:0 auto;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1);}\n  footer .brand{margin-bottom:14px;}\n  footer p{font-size:13.5px;color:#96a89d;max-width:280px;}\n  footer h4{font-size:12px;letter-spacing:1px;color:#fff;margin:0 0 16px;text-transform:uppercase;}\n  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}\n  footer a{font-size:13.5px;color:#a9bcb0;}\n  footer a:hover{color:var(--accent);}\n  .foot-bottom{max-width:1320px;margin:24px auto 0;display:flex;justify-content:space-between;font-size:12px;color:#7c8f83;}\n\n  @media(max-width:900px){\n    .site-nav{padding:16px 24px;} .site-links{display:none;}\n    .welcome-hero{padding:50px 24px 0;} .wh-grid{grid-template-columns:1fr;gap:34px;padding-bottom:50px;}\n    .lush-banner{padding:34px;min-height:50vh;}\n    section.wrap{padding:70px 24px;} .story{grid-template-columns:1fr;gap:36px;} .story-stats{border-left:none;padding-left:0;grid-template-columns:1fr 1fr;}\n    .values{padding:70px 24px;} .values-grid{grid-template-columns:1fr 1fr;}\n    .amenities{grid-template-columns:1fr 1fr 1fr;}\n  }\n</style>\n</head>\n<body>\n\n<nav class=\"site-nav\">\n  <a href=\"home.html\" class=\"brand\">\ud83c\udf3f LANKA WILD TRAILS <em>| SANCTUARY</em></a>\n  <div class=\"site-links\">\n    <a href=\"home.html\">Journal</a>\n    <a href=\"welcome.html\" class=\"current\">The Sanctuary</a>\n    <a href=\"room.html\">Cottages</a>\n    <a href=\"index.html\" class=\"staff-link\">Staff Portal</a>\n    <a href=\"room.html\" class=\"nav-cta\">Reserve a Stay</a>\n  </div>\n</nav>\n\n<header class=\"welcome-hero\">\n  <div class=\"wh-grid\">\n    <div class=\"wh-text\">\n      <div class=\"eyebrow hero-anim d1\">HORIZON CONSERVATION GROUP</div>\n      <h1 class=\"hero-anim d2\">Welcome to the Sanctuary</h1>\n      <p class=\"hero-anim d3\">Fourteen cottages built into sixty acres of working conservation land on the northern edge of Yala. This is where the reservation system you're testing actually sends people.</p>\n    </div>\n    <div class=\"wh-images\">\n      <div class=\"tall hero-anim d2\"></div>\n      <div class=\"sq1 hero-anim d3\"></div>\n      <div class=\"sq2 hero-anim d4\"></div>\n    </div>\n  </div>\n</header>\n\n<div class=\"lush-banner\">\n  <div class=\"bg\"></div>\n  <div class=\"lush-in reveal\">\n    <div class=\"eyebrow\">YOUR NEXT FEW NIGHTS</div>\n    <h2>Your new favourite way to wait for a leopard</h2>\n    <p>Full board, two guided walks a day, and a cottage angled toward whatever the forest is doing this week \u2014 booked the same way our front desk books it.</p>\n    <a href=\"room.html\" class=\"btn-solid\">See Available Cottages</a>\n  </div>\n</div>\n\n<section class=\"wrap\">\n  <span class=\"eyebrow\">How this began</span>\n  <h2 class=\"head\">A cattle lease, a fence line, and fourteen years</h2>\n  <div class=\"story reveal\">\n    <div class=\"story-copy\">\n      <p>\"We didn't set out to build a lodge. We set out to buy back a fence line.\"</p>\n      <p>In 2012, the land bordering this stretch of Yala's buffer zone was leased for cattle grazing, which put livestock directly in the path of the elephant corridors that had used the route for generations. Horizon Conservation Group bought out the lease, restored the corridor, and \u2014 several years and a great deal of trial and error later \u2014 built fourteen cottages to fund the work that keeps it open.</p>\n      <p>Every rupee from a booking made through this system goes through the same account that pays our six full-time trackers, the corridor's fencing maintenance, and the anti-poaching patrol that covers our stretch of the buffer zone.</p>\n    </div>\n    <div class=\"story-stats\">\n      <div class=\"story-stat\"><div class=\"figure\">2012</div><div class=\"cap\">Year the original lease was bought out and the corridor restoration began</div></div>\n      <div class=\"story-stat\"><div class=\"figure\">6</div><div class=\"cap\">Full-time trackers employed year-round from the neighbouring villages</div></div>\n      <div class=\"story-stat\"><div class=\"figure\">38%</div><div class=\"cap\">Share of nightly rate directed to the corridor and patrol fund</div></div>\n    </div>\n  </div>\n</section>\n\n<div class=\"amenities\">\n  <div class=\"amenity\"><div class=\"ic\">\ud83d\udc18</div><div class=\"lbl\">Guided wildlife walks, twice daily</div></div>\n  <div class=\"amenity\"><div class=\"ic\">\ud83c\udf7d\ufe0f</div><div class=\"lbl\">Full board, kitchen-garden sourced</div></div>\n  <div class=\"amenity\"><div class=\"ic\">\ud83d\udd2d</div><div class=\"lbl\">Resident naturalist briefings</div></div>\n  <div class=\"amenity\"><div class=\"ic\">\ud83d\ude99</div><div class=\"lbl\">Private safari transfers</div></div>\n  <div class=\"amenity\"><div class=\"ic\">\ud83d\udd6f\ufe0f</div><div class=\"lbl\">Solar-powered, no generator noise</div></div>\n  <div class=\"amenity\"><div class=\"ic\">\ud83e\ude7a</div><div class=\"lbl\">On-site first aid & field medic</div></div>\n</div>\n\n<section class=\"values\" style=\"padding-top:100px;\">\n  <div style=\"max-width:1320px;margin:0 auto;\">\n    <span class=\"eyebrow\">What we hold ourselves to</span>\n    <h2 class=\"head\">Four rules the sanctuary doesn't bend on</h2>\n  </div>\n  <div class=\"values-grid\">\n    <div class=\"value-card reveal\"><div class=\"ic\">\ud83c\udf3f</div><h4>Land before lodging</h4><p>No cottage is built until the corridor survey confirms it won't sit on an active wildlife route.</p></div>\n    <div class=\"value-card reveal stagger-1\"><div class=\"ic\">\ud83d\udc65</div><h4>Local employment first</h4><p>Every tracker, guide, and kitchen hand is hired from the two neighbouring villages.</p></div>\n    <div class=\"value-card reveal stagger-2\"><div class=\"ic\">\ud83d\udccb</div><h4>Transparent booking</h4><p>The same system your reservation runs through is the one our own front desk uses \u2014 no separate \"guest\" pricing tier.</p></div>\n    <div class=\"value-card reveal stagger-3\"><div class=\"ic\">\ud83d\udd25</div><h4>Low-impact by default</h4><p>Solar power, greywater recycling, and a hard cap of fourteen cottages, permanently.</p></div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"foot-grid\">\n    <div>\n      <div class=\"brand\">\ud83c\udf3f LANKA WILD TRAILS</div>\n      <p>A sixty-acre private sanctuary on the northern buffer of Yala National Park, Sri Lanka. Fourteen cottages, working conservation land.</p>\n    </div>\n    <div>\n      <h4>Explore</h4>\n      <ul>\n        <li><a href=\"home.html\">Journal</a></li>\n        <li><a href=\"welcome.html\">The Sanctuary</a></li>\n        <li><a href=\"room.html\">Cottages & Rates</a></li>\n      </ul>\n    </div>\n    <div>\n      <h4>Stay</h4>\n      <ul>\n        <li><a href=\"room.html\">Check Availability</a></li>\n        <li><a href=\"index.html\">Manage a Reservation</a></li>\n        <li><a href=\"welcome.html\">Conservation Fee</a></li>\n      </ul>\n    </div>\n    <div>\n      <h4>Contact</h4>\n      <ul>\n        <li><a href=\"tel:+94770000000\">+94 77 000 0000</a></li>\n        <li><a href=\"mailto:stay@lankawildtrails.lk\">stay@lankawildtrails.lk</a></li>\n        <li><a href=\"#\">Block 1, Yala Buffer Zone, LK</a></li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Lanka Wild Trails Sanctuary</span>\n    <span>Built for the Software Engineering module \u2014 Cottage Reservation System</span>\n  </div>\n</footer>\n\n\n<!-- ===== Shared cross-page + animation kit (auto-injected) ===== -->\n<style id=\"wt-anim-style\">\n  @keyframes wtFadeUp { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }\n  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);}\n  .reveal.in-view{opacity:1; transform:translateY(0);}\n  .reveal.stagger-1{transition-delay:.06s;} .reveal.stagger-2{transition-delay:.14s;}\n  .reveal.stagger-3{transition-delay:.22s;} .reveal.stagger-4{transition-delay:.30s;}\n  .reveal.stagger-5{transition-delay:.38s;} .reveal.stagger-6{transition-delay:.46s;}\n  .hero-anim{opacity:0; transform:translateY(18px); animation:wtFadeUp .85s cubic-bezier(.16,1,.3,1) forwards;}\n  .hero-anim.d1{animation-delay:.05s;} .hero-anim.d2{animation-delay:.20s;}\n  .hero-anim.d3{animation-delay:.35s;} .hero-anim.d4{animation-delay:.50s;}\n</style>\n<script>\n(function(){\n  function initReveal(){\n    var els = document.querySelectorAll('.reveal');\n    els.forEach(function(el){\n      var r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92 && r.bottom > 0) el.classList.add('in-view');\n    });\n    if (window.__wtIO) { try { window.__wtIO.disconnect(); } catch(e){} }\n    var io = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('.reveal:not(.in-view)').forEach(function(el){ io.observe(el); });\n    window.__wtIO = io;\n  }\n  function playHero(){\n    document.querySelectorAll('.hero-anim').forEach(function(el){\n      el.style.animation = 'none';\n      void el.offsetWidth;\n      el.style.animation = '';\n    });\n  }\n  function countUp(el){\n    if (el.dataset.counted) return;\n    var raw = (el.textContent || '').trim();\n    var target = parseFloat(raw.replace(/[^0-9.]/g, ''));\n    if (!isFinite(target)) return;\n    el.dataset.counted = '1';\n    var suffix = raw.replace(/[0-9.,]/g, '');\n    var t0 = null, dur = 1100;\n    function step(ts){\n      if (!t0) t0 = ts;\n      var p = Math.min(1, (ts - t0) / dur);\n      var eased = 1 - Math.pow(1 - p, 3);\n      var val = Math.round(target * eased);\n      el.textContent = val + suffix;\n      if (p < 1) requestAnimationFrame(step);\n      else el.textContent = raw;\n    }\n    requestAnimationFrame(step);\n  }\n  function initCounters(){\n    var nums = document.querySelectorAll('.figure, .stat-box .n');\n    if (!nums.length) return;\n    var io2 = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){ if (e.isIntersecting){ countUp(e.target); io2.unobserve(e.target); } });\n    }, { threshold: 0.4 });\n    nums.forEach(function(el){ io2.observe(el); });\n  }\n\n  // Cross-page navigation: works standalone (real files) and embedded (single-file artifact)\n  var PAGE_MAP = { 'home.html':'home', 'welcome.html':'welcome', 'room.html':'room', 'staff.html':'staff', 'index.html':'staff' };\n  document.addEventListener('click', function(e){\n    var a = e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];\n    if (PAGE_MAP[href] && window.parent && window.parent !== window && typeof window.parent.gotoPage === 'function') {\n      e.preventDefault();\n      window.parent.gotoPage(PAGE_MAP[href]);\n    }\n  }, true);\n\n  function hideEmbeddedNav(){\n    if (window.self === window.top) return;\n    document.querySelectorAll('.site-nav, .top-bar, .site-utility-bar').forEach(function(n){ n.style.display = 'none'; });\n    document.documentElement.classList.add('wt-embedded');\n  }\n\n  document.addEventListener('DOMContentLoaded', function(){\n    hideEmbeddedNav();\n    initReveal();\n    initCounters();\n    playHero();\n  });\n  window.initReveal = initReveal;\n  window.playHero = playHero;\n})();\n<\/script>\n\n</body>\n</html>\n", "room": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Reserve a Cottage | Lanka Wild Trails</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --primary:#0f2318; --secondary:#284b36; --accent:#d4af37;\n    --cream:#fbf9f5; --text:#1c2620; --muted:#5a6e62;\n    --line:#e6e1d3;\n    --shadow:0 20px 40px -15px rgba(15,35,24,0.12);\n    --transition:all .3s cubic-bezier(.16,1,.3,1);\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:#fff;color:var(--text);line-height:1.7;}\n  a{text-decoration:none;color:inherit;}\n  img{display:block;max-width:100%;}\n  button{font-family:inherit;}\n\n  /* ===== Top bar (light, commercial) ===== */\n  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:20px 60px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:80;}\n  .brand{font-family:'Playfair Display',serif;font-size:19px;letter-spacing:1px;color:var(--primary);display:flex;align-items:baseline;gap:7px;}\n  .brand span{color:var(--accent);}\n  .top-links{display:flex;align-items:center;gap:34px;}\n  .top-links a{font-size:13px;font-weight:600;color:var(--text);}\n  .top-links a.current{color:var(--secondary);border-bottom:2px solid var(--accent);padding-bottom:4px;}\n  .top-links a:hover{color:var(--secondary);}\n  .staff-link{font-size:11.5px;color:var(--muted);border:1px t:0;bottom:0;padding:20px;color:#fff;}\n  .pick-card h4{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:18px;font-weight:600;}\n  .pick-card .rate{font-size:12px;color:var(--accent);font-weight:700;}\n  .pick-card:hover .shade{background:linear-gradient(0deg, rgba(9,20,14,.9) 0%, rgba(9,20,14,.1) 60%);}\n\n  /* ===== Content grid: details + reserve ===== */\n  .content-grid{display:grid;grid-template-columns:1fr 380px;gap:60px;margin-top:56px;align-items:start;}\n\n  .tabs{display:flex;gap:34px;border-bottom:1px solid var(--line);margin-bottom:30px;}\n  .tabs a{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--muted);padding-bottom:16px;border-bottom:2px solid transparent;}\n  .tabs a.on{color:var(--primary);border-color:var(--accent);}\n\n  .about h2{font-family:'Playfair Display',serif;font-size:24px;color:var(--primary);margin:0 0 14px;font-weight:600;}\n  .about p{color:var(--muted);font-size:15px;}\n  .rating{display:flex;align-items:center;gap:10px;margin:18px 0 26px;}\n  .rating .score{font-family:'Playfair Display',serif;font-size:26px;color:var(--primary);}\n  .rating .stars{color:var(--accent);letter-spacing:2px;}\n  .rating .count{font-size:12.5px;color:var(--muted);}\n\n  .amen-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;margin:26px 0 36px;}\n  .amen-grid div{font-size:14px;color:var(--text);display:flex;gap:10px;align-items:center;}\n  .amen-grid div::before{content:'\u2713';color:var(--secondary);font-weight:700;}\n\n  .policy-list{margin:0 0 36px;padding:0;list-style:none;}\n  .policy-list li{font-size:14px;color:var(--muted);padding:10px 0;border-top:1px solid var(--line);}\n  .policy-list li:first-child{border-top:none;}\n  .policy-list li strong{color:var(--text);}\n\n  .special{background:#f7f4ec;border-radius:8px;padding:26px 28px;margin-bottom:20px;}\n  .special h3{font-family:'Playfair Display',serif;margin:0 0 14px;font-size:18px;color:var(--primary);font-weight:600;}\n  .special ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;}\n  .special li{margin-bottom:8px;}\n\n  /* ===== Reserve card ===== */\n  .reserve-card{position:sticky;top:96px;border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:var(--shadow);}\n  .reserve-card h3{font-family:'Playfair Display',serif;font-size:20px;margin:0 0 20px;color:var(--primary);font-weight:600;}\n  .reserve-card .field{margin-bottom:14px;}\n  .reserve-card label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;}\n  .reserve-card input,.reserve-card select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;outline:none;background:var(--secondary);color:#fff;}\n  .reserve-card input::placeholder{color:#c9d6cd;}\n  .reserve-card input::-webkit-calendar-picker-indicator{filter:invert(1);}\n  .reserve-card select option{background:var(--secondary);color:#fff;}\n  .reserve-card input:focus,.reserve-card select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,175,55,.15);}\n  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n  .price-line{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;padding-top:16px;border-top:1px solid var(--line);}\n  .price-line .amt{font-family:'Playfair Display',serif;font-size:24px;color:var(--primary);}\n  .price-line .per{font-size:12px;color:var(--muted);}\n  .reserve-btn{width:100%;background:var(--accent);color:var(--primary);border:none;padding:15px;border-radius:6px;font-weight:700;font-size:13.5px;letter-spacing:.4px;cursor:pointer;margin-top:14px;transition:var(--transition);}\n  .reserve-btn:hover{background:#e4c25e;}\n  .reserve-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;}\n\n  /* ===== Versatile spaces ===== */\n  section.spaces{margin:100px 0 0;}\n  section.spaces h2, section.highlights h2{font-family:'Playfair Display',serif;fon
