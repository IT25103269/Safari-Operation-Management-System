<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Maintenance Issue - Lanka Wild Trails</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f2; color: #1f2933; }
        main { padding: 30px; } section { max-width: 850px; margin: auto; padding: 28px; background: white; border: 1px solid #d9e2d0; border-radius: 8px; }
        .eyebrow { color: #3f6b35; font-weight: bold; text-transform: uppercase; } h1 { margin-top: 0; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 15px; }
        label { font-weight: bold; margin-bottom: 4px; display: block; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5c0; border-radius: 6px; box-sizing: border-box; }
        .full { grid-column: 1 / -1; } .actions { grid-column: 1 / -1; text-align: right; margin-top: 10px; }
        a, button { padding: 10px 16px; border: 0; border-radius: 6px; font-weight: bold; text-decoration: none; background: #3f6b35; color: white; cursor: pointer; }
        .secondary { background: #e8eee2; color: #2f3a2f; margin-right: 8px; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
<main>
    <section>
        <p class="eyebrow">Vehicle Management</p>
        <h1>Report Maintenance Issue</h1>
        <p id="vehicleLabel" style="font-weight: bold; color: #3f6b35;">Vehicle: Loading...</p>

        <div id="alertBox" class="alert"></div>

        <form id="maintenanceForm" onsubmit="handleSubmit(event)">
            <div class="full">
                <label for="issueTitle">Issue Title *</label>
                <input type="text" id="issueTitle" placeholder="e.g. Brake pad wear, Engine oil service, Flat tire" required>
            </div>
            <div>
                <label for="reportedBy">Reported By</label>
                <input type="text" id="reportedBy" placeholder="e.g. Nimal (Driver)">
            </div>
            <div>
                <label for="priority">Priority Level</label>
                <select id="priority">
                    <option value="High">High (Immediate service needed)</option>
                    <option value="Medium" selected>Medium (Routine repair)</option>
                    <option value="Low">Low (Minor cosmetic / check)</option>
                </select>
            </div>
            <div class="full">
                <label for="description">Detailed Description *</label>
                <textarea id="description" rows="5" placeholder="Describe symptoms, location during trip, odometer reading, or part required..." required></textarea>
            </div>
            <div class="actions">
                <a id="cancelLink" class="secondary" href="vehicles-list.html">Cancel</a>
                <button type="submit">Submit Issue</button>
            </div>
        </form>
    </section>
</main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const vehicleId = urlParams.get('vehicleId');

    if (!vehicleId) {
        window.location.href = "vehicles-list.html";
    }

    document.getElementById('cancelLink').href = `vehicle-details.html?id=${vehicleId}`;

    function showAlert(msg, isSuccess) {
        const box = document.getElementById('alertBox');
        box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        box.innerText = msg;
        box.style.display = 'block';
    }

    async function loadVehicleInfo() {
        try {
            const res = await fetch('/api/vehicles/' + vehicleId);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('vehicleLabel').innerText = `Vehicle: ${data.vehicle.registrationNumber} (${data.vehicle.vehicleType})`;
                if (data.vehicle.assignedDriver) {
                    document.getElementById('reportedBy').value = data.vehicle.assignedDriver;
                }
            }
        } catch (e) {
            console.error("Could not fetch vehicle header", e);
        }
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const issueTitle = document.getElementById('issueTitle').value.trim();
        const reportedBy = document.getElementById('reportedBy').value.trim();
        const priority = document.getElementById('priority').value;
        const description = document.getElementById('description').value.trim();

        if (!issueTitle || !description) {
            showAlert("Title and description are required.", false);
            return;
        }

        const payload = {
            issueTitle,
            reportedBy: reportedBy || null,
            priority,
            description,
            status: "OPEN"
        };

        try {
            const res = await fetch(`/api/vehicles/${vehicleId}/maintenance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showAlert("Maintenance issue logged successfully! Redirecting...", true);
                setTimeout(() => {
                    window.location.href = `vehicle-details.html?id=${vehicleId}`;
                }, 1000);
            } else {
                const err = await res.json();
                showAlert(err.error || "Failed to submit maintenance issue.", false);
            }
        } catch (e) {
            showAlert("Server communication error.", false);
        }
    }

    document.addEventListener('DOMContentLoaded', loadVehicleInfo);
</script>
</body>
</html>
