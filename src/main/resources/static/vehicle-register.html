<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Vehicle</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f2; color: #1f2933; }
        main { padding: 30px; } section { max-width: 850px; margin: auto; padding: 28px; background: white; border: 1px solid #d9e2d0; border-radius: 8px; }
        .eyebrow { color: #3f6b35; font-weight: bold; text-transform: uppercase; } h1 { margin-top: 0; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        label { font-weight: bold; } input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5c0; border-radius: 6px; box-sizing: border-box; }
        .full { grid-column: 1 / -1; } .actions { grid-column: 1 / -1; text-align: right; }
        a, button { padding: 10px 14px; border: 0; border-radius: 6px; font-weight: bold; text-decoration: none; background: #3f6b35; color: white; }
        .secondary { background: #e8eee2; color: #2f3a2f; }
    </style>
</head>
<body>
<main>
    <section>
        <p class="eyebrow">Vehicle Management</p>
        <h1>Register Safari Vehicle</h1>
        <form>
            <div><label>Registration Number</label><input value="WP CAB-1234"></div>
            <div><label>Vehicle Type</label><input value="Safari Jeep"></div>
            <div><label>Seating Capacity</label><input type="number" value="6"></div>
            <div><label>Assigned Driver</label><input value="Nimal Perera"></div>
            <div><label>Status</label><select><option>AVAILABLE</option><option>IN_USE</option><option>UNDER_MAINTENANCE</option></select></div>
            <div class="full"><label>Description</label><textarea rows="4">Open safari jeep for wildlife trail trips.</textarea></div>
            <div class="actions">
                <a class="secondary" href="vehicles-list.html">Cancel</a>
                <button type="button">Register Vehicle</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
