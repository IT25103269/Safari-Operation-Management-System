<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Species Management - Lanka Wild Trails</title>
    <style>
        :root {
            --primary-color: #2e5a27;
            --primary-dark: #23441d;
            --secondary-color: #8c6239;
            --bg-light: #f4f6f3;
            --text-dark: #2c3e50;
            --border-color: #dcdde1;
            --danger-color: #c0392b;
            --warning-color: #d35400;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: #e2f0d9;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 2rem;
        }

        @media (max-width: 950px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 1.8rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 0.6rem;
            font-size: 1.3rem;
        }

        .edit-notice-box {
            display: none;
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
            color: #0369a1;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
            font-size: 0.88rem;
            color: #34495e;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(46, 90, 39, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-update {
            background-color: var(--warning-color) !important;
        }
        .btn-update:hover {
            background-color: #b34300 !important;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn-cancel {
            background-color: #64748b;
            color: white;
        }
        .btn-cancel:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-edit {
            background-color: #2980b9;
            color: white;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.88rem;
        }

        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }

        th {
            background-color: #e9efe8;
            color: var(--primary-color);
            font-weight: 600;
        }

        .row-editing {
            background-color: #f0f9ff !important;
            border-left: 4px solid #0284c7;
        }

        .row-updated {
            animation: highlightRow 2.5s ease-in-out;
        }

        @keyframes highlightRow {
            0% { background-color: #fef08a; }
            50% { background-color: #dcfce7; }
            100% { background-color: transparent; }
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge-active {
            background-color: #d4edda;
            color: #155724;
        }

        .badge-archived {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .badge-endangered {
            background-color: #f8d7da;
            color: #721c24;
        }

        .action-btns {
            display: flex;
            gap: 0.4rem;
        }

        .thumbnail {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #eee;
        }

        .alert-box {
            display: none;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<header>
    <h1>Lanka Wild Trails - Wildlife Management</h1>
    <div>
        <span style="font-size: 0.9rem; margin-right: 15px;">Role: Wildlife Officer / Admin</span>
        <a href="wildlife-catalogue.html">Tourist View</a>
        <a href="index.html">Main Menu</a>
    </div>
</header>

<div class="container">
    <div id="statusAlert" class="alert-box alert-success"></div>

    <div class="grid-layout">
        <!-- Form to Add or Edit Species -->
        <div class="card">
            <h2 id="formTitle">Register New Wildlife Species</h2>

            <!-- Notice displayed only when actively editing an existing record -->
            <div id="editNotice" class="edit-notice-box">
                <span id="editNoticeText">Editing Mode: Updating Species</span>
            </div>

            <form id="speciesForm">
                <input type="hidden" id="speciesId" name="speciesId" value="0">

                <div class="form-group">
                    <label for="commonName">Common Name *</label>
                    <input type="text" id="commonName" name="commonName" placeholder="e.g. Sri Lankan Leopard" required>
                </div>

                <div class="form-group">
                    <label for="scientificName">Scientific Name *</label>
                    <input type="text" id="scientificName" name="scientificName" placeholder="e.g. Panthera pardus kotiya" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="Mammal">Mammal</option>
                            <option value="Bird">Bird</option>
                            <option value="Reptile">Reptile</option>
                            <option value="Amphibian">Amphibian</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="conservationStatus">IUCN Status *</label>
                        <select id="conservationStatus" name="conservationStatus" required>
                            <option value="Endangered">Endangered</option>
                            <option value="Critically Endangered">Critically Endangered</option>
                            <option value="Vulnerable">Vulnerable</option>
                            <option value="Near Threatened">Near Threatened</option>
                            <option value="Least Concern">Least Concern</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="primaryPark">Primary National Park *</label>
                        <select id="primaryPark" name="primaryPark" required>
                            <option value="Yala">Yala</option>
                            <option value="Wilpattu">Wilpattu</option>
                            <option value="Udawalawe">Udawalawe</option>
                            <option value="Minneriya">Minneriya</option>
                            <option value="Bundala">Bundala</option>
                            <option value="Sinharaja">Sinharaja</option>
                            <option value="Horton Plains">Horton Plains</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dietaryHabit">Dietary Habit</label>
                        <select id="dietaryHabit" name="dietaryHabit">
                            <option value="Carnivore">Carnivore</option>
                            <option value="Herbivore">Herbivore</option>
                            <option value="Omnivore">Omnivore</option>
                            <option value="Piscivore">Piscivore</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="habitat">Natural Habitat Description</label>
                    <input type="text" id="habitat" name="habitat" placeholder="e.g. Lowland dry zone scrub jungles">
                </div>

                <div class="form-group">
                    <label for="bestSpottingTime">Best Spotting Time / Tips</label>
                    <input type="text" id="bestSpottingTime" name="bestSpottingTime" placeholder="e.g. Early dawn (06:00 - 08:30)">
                </div>

                <div class="form-group">
                    <label for="imageUrl">Photo Image URL</label>
                    <input type="text" id="imageUrl" name="imageUrl" placeholder="https://example.com/species.jpg">
                </div>

                <div class="form-group">
                    <label for="description">Detailed Description</label>
                    <textarea id="description" name="description" rows="3" placeholder="Key physical traits, behavior, and field identification notes..."></textarea>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap;">
                    <button type="submit" class="btn" id="submitBtn">Save Species Record</button>
                    <button type="button" class="btn btn-cancel" id="cancelEditBtn" style="display: none;" onclick="cancelEdit()">Cancel Edit</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
                </div>
            </form>
        </div>

        <!-- Species Directory Table -->
        <div class="card">
            <h2>Registered Wildlife Species Catalogue</h2>

            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="tableFilter" placeholder="Search by name or park..." oninput="filterTable()" style="max-width: 300px;">
                <button class="btn" onclick="loadTableData()">Refresh Data</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Common Name</th>
                        <th>Category</th>
                        <th>Park</th>
                        <th>IUCN Status</th>
                        <th>Record Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="speciesTableBody">
                    <!-- Dynamic Rows rendered by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

    let localRecords = speciesList;

    async function loadTableData() {
        if (window.location.protocol.startsWith('http')) {
            try {
                const res = await fetch('/api/wildlife');
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        speciesList = data.map(s => ({ id: s.speciesId || s.id, ...s }));
                        localRecords = speciesList;
                    }
                }
            } catch (e) {
                console.log("Using local mock dataset for demonstration.");
            }
        }
        renderTable();
    }

    function renderTable(list = speciesList, highlightId = null) {
        const tbody = document.getElementById('speciesTableBody');
        if (!tbody) return;

        const dataToRender = Array.isArray(list) ? list : speciesList;
        if (!dataToRender || dataToRender.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #666; padding: 25px;">No species records found matching your filter.</td></tr>`;
            return;
        }

        tbody.innerHTML = dataToRender.map(s => {
            const sid = parseInt(s.id || s.speciesId || 0, 10);
            const isBeingEdited = (editingId !== null && editingId === sid);
            const isRecentlyUpdated = (highlightId !== null && highlightId === sid);
            const rowClass = isBeingEdited ? 'row-editing' : (isRecentlyUpdated ? 'row-updated' : '');
            const safeImg = (s.imageUrl && s.imageUrl.trim() !== '') 
                ? s.imageUrl 
                : 'https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=100';

            return `
            <tr class="${rowClass}" id="species-row-${sid}">
                <td><img class="thumbnail" src="${safeImg}" alt="${s.commonName || 'Wildlife'}" onerror="this.src='https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=100'"></td>
                <td><strong>${s.commonName || ''}</strong><br><small style="color: #666; font-style: italic;">${s.scientificName || ''}</small></td>
                <td>${s.category || ''}</td>
                <td>${s.primaryPark || ''}</td>
                <td><span class="badge ${s.conservationStatus === 'Endangered' ? 'badge-endangered' : ''}">${s.conservationStatus || ''}</span></td>
                <td><span class="badge ${s.status === 'Active' ? 'badge-active' : 'badge-archived'}">${s.status || 'Active'}</span></td>
                <td class="action-btns">
                    <button type="button" class="btn-edit" onclick="populateEdit(${sid})">${isBeingEdited ? 'Editing...' : 'Edit'}</button>
                    <button type="button" class="btn-danger" onclick="archiveSpecies(${sid})">Archive</button>
                </td>
            </tr>
            `;
        }).join('');

        if (highlightId) {
            setTimeout(() => {
                const row = document.getElementById(`species-row-${highlightId}`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 50);
        }
    }

    function populateEdit(id) {
        const item = speciesList.find(s => (s.id === id || s.speciesId === id));
        if (!item) return;

        editingId = id;
        editingSpeciesId = id;

        // Populate every form field
        document.getElementById('speciesId').value = id;
        document.getElementById('commonName').value = item.commonName || '';
        document.getElementById('scientificName').value = item.scientificName || '';
        document.getElementById('category').value = item.category || 'Mammal';
        document.getElementById('conservationStatus').value = item.conservationStatus || 'Least Concern';
        document.getElementById('primaryPark').value = item.primaryPark || 'Yala';
        document.getElementById('dietaryHabit').value = item.dietaryHabit || 'Carnivore';
        document.getElementById('habitat').value = item.habitat || '';
        document.getElementById('bestSpottingTime').value = item.bestSpottingTime || '';
        document.getElementById('imageUrl').value = item.imageUrl || '';
        document.getElementById('description').value = item.description || '';

        // Activate Visual Editing Mode
        document.getElementById('formTitle').innerText = `✏️ Edit: ${item.commonName}`;
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Update Species Record";
        submitBtn.classList.add('btn-update');

        const editNotice = document.getElementById('editNotice');
        document.getElementById('editNoticeText').innerHTML = `<strong>Editing Mode:</strong> Updating species <em>${item.commonName}</em> (ID: #${id})`;
        editNotice.style.display = 'block';

        document.getElementById('cancelEditBtn').style.display = 'inline-block';

        // Highlight the row in the table
        renderTable();

        // Smoothly scroll to the form
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingId = null;
        editingSpeciesId = null;
        resetForm();
        renderTable();
        showAlert("Editing mode cancelled.");
    }

    function resetForm() {
        editingId = null;
        editingSpeciesId = null;
        document.getElementById('speciesForm').reset();
        document.getElementById('speciesId').value = "0";

        // Reset UI labels and buttons
        document.getElementById('formTitle').innerText = "Register New Wildlife Species";
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Save Species Record";
        submitBtn.classList.remove('btn-update');

        document.getElementById('editNotice').style.display = 'none';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    async function archiveSpecies(id) {
        const item = speciesList.find(s => (s.id === id || s.speciesId === id));
        const name = item ? item.commonName : "this species";
        if (!confirm(`Are you sure you want to archive "${name}"?`)) return;

        if (editingId === id) {
            cancelEdit();
        }

        if (window.location.protocol.startsWith('http')) {
            try {
                await fetch(`/api/wildlife/archive/${id}`, { method: 'POST' });
            } catch (err) {
                console.log("Local offline mode active.");
            }
        }

        speciesList = speciesList.filter(s => (s.id !== id && s.speciesId !== id));
        localRecords = speciesList;
        renderTable();
        showAlert(`Archived "${name}" successfully.`);
    }

    function filterTable() {
        const filterInput = document.getElementById('tableFilter');
        const q = filterInput ? filterInput.value.toLowerCase().trim() : '';
        if (!q) {
            renderTable(speciesList);
            return;
        }
        const filtered = speciesList.filter(s => {
            const cName = (s.commonName || '').toLowerCase();
            const sName = (s.scientificName || '').toLowerCase();
            const park = (s.primaryPark || '').toLowerCase();
            const cat = (s.category || '').toLowerCase();
            return cName.includes(q) || sName.includes(q) || park.includes(q) || cat.includes(q);
        });
        renderTable(filtered);
    }

    function showAlert(msg) {
        const alert = document.getElementById('statusAlert');
        alert.innerText = msg;
        alert.style.display = 'block';
        setTimeout(() => { alert.style.display = 'none'; }, 4000);
    }

    // Form Submit Listener: Handles both In-Place Update and New Registration
    document.getElementById('speciesForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = {
            commonName: document.getElementById('commonName').value.trim(),
            scientificName: document.getElementById('scientificName').value.trim(),
            category: document.getElementById('category').value,
            conservationStatus: document.getElementById('conservationStatus').value,
            primaryPark: document.getElementById('primaryPark').value,
            dietaryHabit: document.getElementById('dietaryHabit').value,
            habitat: document.getElementById('habitat').value.trim(),
            bestSpottingTime: document.getElementById('bestSpottingTime').value.trim(),
            imageUrl: document.getElementById('imageUrl').value.trim(),
            description: document.getElementById('description').value.trim(),
            status: "Active"
        };

        const targetEditingId = editingId;

        if (targetEditingId !== null && targetEditingId > 0) {
            // update logic
            const index = speciesList.findIndex(s => s.id === targetEditingId);
            if (index !== -1) {
                speciesList[index] = {
                    ...speciesList[index],
                    ...formData,
                    id: targetEditingId,
                    speciesId: targetEditingId
                };
                localRecords = speciesList;

                // Reset any active search/filter so updated record is immediately visible
                const filterInput = document.getElementById('tableFilter');
                if (filterInput) {
                    filterInput.value = '';
                }

                renderTable(speciesList, targetEditingId); // அட்டவணையை மீண்டும் வரையும்
            }
            showAlert(`✅ "${formData.commonName}" updated successfully!`);
        } else {
            // Register new species: calculate unique id
            let maxId = 0;
            for (let i = 0; i < speciesList.length; i++) {
                const sid = parseInt(speciesList[i].id || speciesList[i].speciesId || 0, 10);
                if (!isNaN(sid) && sid > maxId) {
                    maxId = sid;
                }
            }
            const uniqueId = maxId > 0 ? maxId + 1 : 1;

            const newSpecies = {
                id: uniqueId,
                speciesId: uniqueId,
                commonName: formData.commonName,
                scientificName: formData.scientificName,
                category: formData.category,
                conservationStatus: formData.conservationStatus,
                habitat: formData.habitat || "Lowland dry and wet zone forest fringes",
                primaryPark: formData.primaryPark,
                dietaryHabit: formData.dietaryHabit || "Herbivore",
                bestSpottingTime: formData.bestSpottingTime || "Early morning (06:00 - 08:30)",
                imageUrl: formData.imageUrl || "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=600",
                description: formData.description || "Field catalogued wildlife specimen in Sri Lankan national parks.",
                status: "Active"
            };

            // Pushes to the master array
            speciesList.push(newSpecies);
            localRecords = speciesList;

            // Resets any active search/filter
            const filterInput = document.getElementById('tableFilter');
            if (filterInput) {
                filterInput.value = '';
            }

            // Immediately calls renderTable() properly without any JS errors
            renderTable(speciesList, uniqueId); // அட்டவணையை மீண்டும் வரையும்
            showAlert(`✅ New species "${newSpecies.commonName}" registered successfully!`);
        }

        // If connected to Spring Boot server over HTTP/HTTPS, synchronize in background
        if (window.location.protocol.startsWith('http')) {
            try {
                fetch('/api/wildlife', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(targetEditingId ? { ...formData, id: targetEditingId, speciesId: targetEditingId } : formData)
                }).then(res => {
                    if (res && res.ok) {
                        console.log("Synced species with backend database.");
                    }
                }).catch(err => {
                    console.warn("Backend API not reachable. Local record saved.", err);
                });
            } catch (err) {
                console.warn("Offline or backend unreachable.", err);
            }
        }

        // Reset form to default Add mode
        resetForm();
    });

    document.addEventListener('DOMContentLoaded', loadTableData);
</script>

</body>
</html>
