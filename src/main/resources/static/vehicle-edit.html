<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vehicle - Lanka Wild Trails</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f2; color: #1f2933; }
        main { padding: 30px; } section { max-width: 850px; margin: auto; padding: 28px; background: white; border: 1px solid #d9e2d0; border-radius: 8px; }
        .eyebrow { color: #3f6b35; font-weight: bold; text-transform: uppercase; } h1 { margin-top: 0; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 15px; }
        label { font-weight: bold; margin-bottom: 4px; display: block; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5c0; border-radius: 6px; box-sizing: border-box; }
        .full { grid-column: 1 / -1; } .actions { grid-column: 1 / -1; text-align: right; margin-top: 10px; }
        a, button { padding: 10px 16px; border: 0; border-radius: 6px; font-weight: bold; text-decoration: none; background: #3f6b35; color: white; cursor: pointer; }
        .secondary { background: #e8eee2; color: #2f3a2f; margin-right: 8px; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
<main>
    <section>
        <p class="eyebrow">Vehicle Management</p>
        <h1 id="editHeading">Edit Safari Vehicle</h1>

        <div id="alertBox" class="alert"></div>

        <form id="vehicleEditForm" onsubmit="handleUpdate(event)">
            <div>
                <label for="regNumber">Registration Number *</label>
                <input type="text" id="regNumber" required>
            </div>
            <div>
                <label for="vehicleType">Vehicle Type *</label>
                <input type="text" id="vehicleType" required>
            </div>
            <div>
                <label for="capacity">Seating Capacity (Min: 1) *</label>
                <input type="number" id="capacity" min="1" required>
            </div>
            <div>
                <label for="driver">Assigned Driver</label>
                <input type="text" id="driver">
            </div>
            <div class="full">
                <label for="status">Availability Status *</label>
                <select id="status" required>
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="IN_USE">IN_USE</option>
                    <option value="UNDER_MAINTENANCE">UNDER_MAINTENANCE</option>
                    <option value="UNAVAILABLE">UNAVAILABLE</option>
                </select>
            </div>
            <div class="full">
                <label for="description">Vehicle Description</label>
                <textarea id="description" rows="4"></textarea>
            </div>
            <div class="actions">
                <a id="cancelBtn" class="secondary" href="vehicles-list.html">Cancel</a>
                <button type="submit">Update Vehicle</button>
            </div>
        </form>
    </section>
</main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const vehicleId = urlParams.get('id');

    if (!vehicleId) {
        window.location.href = "not-found.html";
    }

    function showAlert(msg, isSuccess) {
        const box = document.getElementById('alertBox');
        box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        box.innerText = msg;
        box.style.display = 'block';
    }

    async function loadVehicle() {
        try {
            const res = await fetch('/api/vehicles/' + vehicleId);
            if (!res.ok) {
                window.location.href = "not-found.html";
                return;
            }
            const data = await res.json();
            const v = data.vehicle;

            document.getElementById('editHeading').innerText = `Edit Vehicle: ${v.registrationNumber}`;
            document.getElementById('regNumber').value = v.registrationNumber;
            document.getElementById('vehicleType').value = v.vehicleType;
            document.getElementById('capacity').value = v.seatingCapacity;
            document.getElementById('driver').value = v.assignedDriver || '';
            document.getElementById('status').value = v.status;
            document.getElementById('description').value = v.description || '';

            document.getElementById('cancelBtn').href = `vehicle-details.html?id=${v.id}`;
        } catch (e) {
            showAlert("Error loading vehicle details from server.", false);
        }
    }

    async function handleUpdate(event) {
        event.preventDefault();

        const registrationNumber = document.getElementById('regNumber').value.trim();
        const vehicleType = document.getElementById('vehicleType').value.trim();
        const seatingCapacity = parseInt(document.getElementById('capacity').value, 10);
        const assignedDriver = document.getElementById('driver').value.trim();
        const status = document.getElementById('status').value;
        const description = document.getElementById('description').value.trim();

        if (!registrationNumber) {
            showAlert("Registration number is required.", false);
            return;
        }

        if (isNaN(seatingCapacity) || seatingCapacity <= 0) {
            showAlert("Seating capacity must be greater than 0.", false);
            return;
        }

        const payload = {
            registrationNumber,
            vehicleType,
            seatingCapacity,
            assignedDriver: assignedDriver || null,
            status,
            description: description || null
        };

        try {
            const res = await fetch('/api/vehicles/' + vehicleId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showAlert("Vehicle updated successfully! Redirecting...", true);
                setTimeout(() => {
                    window.location.href = `vehicle-details.html?id=${vehicleId}`;
                }, 1000);
            } else {
                const err = await res.json();
                showAlert(err.error || "Failed to update vehicle.", false);
            }
        } catch (e) {
            showAlert("Server communication error.", false);
        }
    }

    document.addEventListener('DOMContentLoaded', loadVehicle);
</script>
</body>
</html>
