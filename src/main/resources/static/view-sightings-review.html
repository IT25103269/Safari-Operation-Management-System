<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderate Sighting Records - Lanka Wild Trails</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #2c3e50;
            --primary-accent: #2980b9;
            --bg-canvas: #f4f4f4;
            --card-bg: #ffffff;
            --border-subtle: #ddd;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: var(--bg-canvas);
        }

        .container {
            max-width: 1050px;
            background: var(--card-bg);
            padding: 24px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #ecf0f1;
        }

        h2 { color: var(--primary-dark); margin: 0; }

        .btn-dash-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ffffff;
            color: var(--primary-dark);
            border: 1px solid var(--border-subtle);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-dash-back:hover { background-color: #e2e8f0; color: var(--primary-accent); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--border-subtle); padding: 12px; text-align: left; font-size: 0.9em; }
        th { background-color: var(--primary-dark); color: white; font-size: 13px; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .badge {
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-Verified { background-color: #27ae60; }
        .badge-Pending { background-color: #f39c12; }
        .badge-Rejected { background-color: #e74c3c; }

        .action-btn {
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-verify { background-color: #27ae60; margin-right: 4px; }
        .btn-verify:hover { background-color: #219150; }
        .btn-reject { background-color: #c0392b; }
        .btn-reject:hover { background-color: #a93226; }

        .alert { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Moderate Wildlife Sighting Records</h2>
        <div>
            <a href="approved-sightings.html" class="btn-dash-back" style="margin-right: 6px;">
                <i class="fa-solid fa-eye"></i> View Public Gallery
            </a>
            <a href="admin-dashboard.html" class="btn-dash-back">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <table>
        <thead>
        <tr>
            <th>Date & Time</th>
            <th>Animal Species</th>
            <th>Park Location & Landmark</th>
            <th>Logged By (Trip)</th>
            <th>Notes</th>
            <th>Status</th>
            <th>Officer Action</th>
        </tr>
        </thead>
        <tbody id="sightingsTableBody">
        <tr>
            <td colspan="7" style="text-align: center; color: #888;">Loading sighting reports...</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function showAlert(msg) {
        const box = document.getElementById('alertBox');
        box.className = 'alert alert-success';
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    async function loadSightings() {
        const tbody = document.getElementById('sightingsTableBody');
        try {
            const res = await fetch('/api/sightings');
            if (!res.ok) throw new Error("Could not load sightings");
            const data = await res.json();

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 25px; color: #888;">No wildlife sightings recorded yet.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(s => {
                const isPending = s.status === 'Pending';
                return `
                <tr>
                    <td><strong>${s.sightingDate}</strong><br><small style="color:#666;">${s.sightingTime}</small></td>
                    <td><strong>${s.speciesName}</strong></td>
                    <td>${s.parkLocation}<br><small style="color:#666;">${s.specificLocation || ''}</small></td>
                    <td>${s.loggedBy || 'Staff'}<br><small style="color:#666;">Ref: ${s.tripRef || 'N/A'}</small></td>
                    <td style="max-width: 250px;"><small>${s.notes || '-'}</small></td>
                    <td><span class="badge badge-${s.status}">${s.status}</span></td>
                    <td>
                        ${isPending ? `
                            <button class="action-btn btn-verify" onclick="reviewStatus(${s.sightingId}, 'Verified')"><i class="fa-solid fa-check"></i> Verify</button>
                            <button class="action-btn btn-reject" onclick="reviewStatus(${s.sightingId}, 'Rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
                        ` : `<span style="color:#888; font-size:12px;">Reviewed</span>`}
                    </td>
                </tr>
                `;
            }).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c0392b;">Error loading sightings from server.</td></tr>';
        }
    }

    async function reviewStatus(id, newStatus) {
        try {
            const res = await fetch(`/api/sightings/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if (res.ok) {
                showAlert(`Sighting #${id} marked as ${newStatus}.`);
                loadSightings();
            } else {
                alert("Failed to update status");
            }
        } catch (e) {
            alert("Server communication error.");
        }
    }

    document.addEventListener('DOMContentLoaded', loadSightings);
</script>

</body>
</html>
