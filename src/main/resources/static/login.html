<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lanka Wild Trails</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .form-card { max-width: 400px; background: white; padding: 25px; margin: auto; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        button { width: 100%; background-color: #2c3e50; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1a252f; }
        .register-link { text-align: center; margin-top: 15px; font-size: 0.85em; }
        .register-link a { color: #27ae60; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>System Login</h2>
    <form action="/login" method="POST">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Sign In</button>
    </form>

    <div class="register-link">
        Don't have an account? <a href="register.html">Register here</a>
    </div>
</div>

</body>
</html>
