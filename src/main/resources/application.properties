# Server Configuration
server.port=8080

# Database Connection (LankaWildTrailsDB)
# Configured for active MySQL instance (localhost:3306, user: root, pass: root)
spring.datasource.url=jdbc:mysql://localhost:3306/LankaWildTrailsDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Alternative: Microsoft SQL Server Configuration (uncomment if using SQL Server on port 1433)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LankaWildTrailsDB;encrypt=false;
